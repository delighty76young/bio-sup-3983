<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>유전 기초 문제풀이</title>
<style>
/* 레이아웃: 푸른 상단 띠(시계) + 한 화면에 문제 하나 + 하단 이전/다음 막대. 정답은 푸른색, 오답은 붉은색으로 구분한다. */
:root {
  --bg: #e9f0f8;
  --surface: #fafcff;
  --fg: #0e2038;
  --muted: #4f6987;
  --line: #c3d4e6;
  --accent: #1d5fb4;
  --accent-ink: #ffffff;
  --pick: #1d5fb4;
  --pick-bg: #dbe8f8;
  --warn: #a85a06;
  --ok: #0b69a8;
  --ok-bg: #d5e9f8;
  --bad: #c0352a;
  --bad-bg: #fbe1dd;
  --hdr: #153f7a;
  --hdr-fg: #ffffff;
  --hdr-sub: #b9cff0;
  --hdr-warn: #ffd18a;
  --hdr-bad: #ffa69b;
  --hdr-track: #33609b;
  --hdr-fill: #8ec1ff;
  --font-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1727;
    --surface: #12233a;
    --fg: #e2ecf8;
    --muted: #8fa6c0;
    --line: #243a58;
    --accent: #6fa8f0;
    --accent-ink: #08182c;
    --pick: #8dbaf5;
    --pick-bg: #1a3558;
    --warn: #e3a25a;
    --ok: #6cc0f0;
    --ok-bg: #123650;
    --bad: #ff8f84;
    --bad-bg: #451f23;
    --hdr: #0d2444;
    --hdr-fg: #e8f1fc;
    --hdr-sub: #8fb0d8;
    --hdr-warn: #f0b970;
    --hdr-bad: #ff9d93;
    --hdr-track: #1d3d66;
    --hdr-fill: #6fa8f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1727;
  --surface: #12233a;
  --fg: #e2ecf8;
  --muted: #8fa6c0;
  --line: #243a58;
  --accent: #6fa8f0;
  --accent-ink: #08182c;
  --pick: #8dbaf5;
  --pick-bg: #1a3558;
  --warn: #e3a25a;
  --ok: #6cc0f0;
  --ok-bg: #123650;
  --bad: #ff8f84;
  --bad-bg: #451f23;
  --hdr: #0d2444;
  --hdr-fg: #e8f1fc;
  --hdr-sub: #8fb0d8;
  --hdr-warn: #f0b970;
  --hdr-bad: #ff9d93;
  --hdr-track: #1d3d66;
  --hdr-fill: #6fa8f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--hdr);
  z-index: 30;
}
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }

.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--hdr);
  color: var(--hdr-fg);
  border-bottom: 1px solid var(--hdr);
}
.top-in, .tbar, .wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 10px;
}
.ident { min-width: 0; }
.kicker {
  display: block;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--hdr-sub);
}
h1 {
  margin: 0;
  font-size: 18px;
  line-height: 1.3;
  font-weight: 700;
  text-wrap: balance;
}
.clock { text-align: right; flex: none; }
.clock span { display: block; font-size: 12px; color: var(--hdr-sub); letter-spacing: 0.06em; }
.clock b {
  font-family: var(--font-mono);
  font-size: 30px;
  line-height: 1.1;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--hdr-fg);
}
.clock.low b { color: var(--hdr-warn); }
.clock.end b { color: var(--hdr-bad); }
.bar { height: 4px; background: var(--hdr-track); }
.bar i { display: block; height: 100%; width: 0; background: var(--hdr-fill); }
.top[data-t="low"] .bar i { background: var(--hdr-warn); }
.top[data-t="end"] .bar i { background: var(--hdr-bad); }

.tbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-block: 8px;
  border-top: 1px solid var(--line);
  background: var(--pick-bg);
  color: var(--fg);
  max-width: none;
}
.tbar-in {
  width: 100%;
  max-width: 728px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.tbar label { font-size: 13px; color: var(--muted); }
.tbar select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
}
.btn {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 12px;
  min-height: 38px;
  cursor: pointer;
  font-weight: 500;
  color: var(--fg);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }

.wrap { padding-block: 16px 12px; }

.ready {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 18px;
  display: grid;
  gap: 12px;
}
.ready h2 { margin: 0; font-size: 22px; line-height: 1.3; text-wrap: balance; }
.ready ul { margin: 0; padding-left: 1.2em; }
.rules {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.rules div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--muted);
}
.rules b { display: block; font-family: var(--font-mono); font-size: 20px; color: var(--fg); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.notice {
  margin: 0 0 10px;
  padding: 8px 12px;
  border: 1px solid var(--pick);
  border-radius: 8px;
  background: var(--pick-bg);
  color: var(--pick);
  font-size: 14px;
}

/* 문제 카드 */
.q {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 16px 14px;
}
.qh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
.num {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 17px;
  background: var(--fg);
  color: var(--bg);
  border-radius: 5px;
  padding: 1px 9px;
}
.of { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.type {
  font-size: 12px;
  font-weight: 700;
  padding: 1px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
}
.type.short { color: var(--pick); border-color: var(--pick); }
.type.essay { color: var(--warn); border-color: var(--warn); }
.tag { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.qt { margin: 0 0 10px; font-size: 18px; white-space: pre-line; }
.box {
  margin: 0 0 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  font-family: var(--font-body);
  font-size: 15px;
  white-space: pre-line;
  overflow-x: auto;
}
.ch { display: grid; gap: 8px; }
.opt {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 12px;
  min-height: 48px;
  cursor: pointer;
}
.opt .mk { flex: none; width: 1.4em; }
.opt span:last-child { min-width: 0; white-space: pre-line; }
.opt:hover:not(:disabled) { border-color: var(--pick); }
.opt.pick { background: var(--pick-bg); border-color: var(--pick); color: var(--pick); font-weight: 500; }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

.free { display: grid; gap: 6px; }
.free .hint2 { margin: 0; font-size: 13px; color: var(--muted); }
.free input, .free textarea {
  width: 100%;
  background: var(--surface);
  color: var(--fg);
  border: 2px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  line-height: 1.6;
}
.free input { min-height: 48px; font-size: 18px; }
.free textarea { min-height: 170px; resize: vertical; }
.free input:focus, .free textarea:focus { border-color: var(--pick); outline: none; }
.free input:disabled, .free textarea:disabled { opacity: 0.7; }

.rows { display: grid; gap: 6px; margin-top: 4px; }
.row {
  display: grid;
  grid-template-columns: 5.2em minmax(0, 1fr);
  gap: 4px 10px;
  align-items: start;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.row .k { font-size: 12px; color: var(--muted); padding-top: 2px; }
.row .v { white-space: pre-wrap; }
.row.right { background: var(--ok-bg); border-color: var(--ok); }
.row.wrong { background: var(--bad-bg); border-color: var(--bad); }
.row.model { background: var(--bg); }

.rubric { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.rubric-t { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
.rb { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.rb input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }

.ans {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px dashed var(--line);
}
.ans b { color: var(--ok); }
.ans p { margin: 4px 0 0; white-space: pre-line; }
.mine { font-size: 13px; color: var(--muted); margin-left: 8px; }

.verdict {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
  padding: 1px 12px;
  border-radius: 999px;
}
.verdict.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.verdict.bad { background: var(--bad); color: var(--surface); border: 1px solid var(--bad); }
.verdict.part { background: var(--warn); color: var(--surface); border: 1px solid var(--warn); }
.verdict.pend { background: var(--pick-bg); color: var(--pick); border: 1px solid var(--pick); }
.q.bad { border: 2px solid var(--bad); background: var(--bad-bg); }
.q.bad .opt:not(.right):not(.wrong), .q.bad .rb, .q.bad .ans { background: var(--surface); }
.q.ok { border-color: var(--ok); }
.q.part { border: 2px solid var(--warn); }
.q.pend { border-color: var(--pick); }

/* 하단 이전/다음 막대 */
.navbar {
  position: sticky;
  bottom: var(--pbar-h, 0px);
  z-index: 15;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
  padding-top: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
}
.navbar .btn { min-height: 48px; }
.navbar .mid { font-family: var(--font-mono); min-width: 7.5em; }

/* 번호표 */
.omr {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 4px;
}
.omr button {
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  padding: 8px 0;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}
.omr button.on { background: var(--pick-bg); border-color: var(--pick); color: var(--pick); }
.omr button.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.omr button.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.omr button.part { border-color: var(--warn); color: var(--warn); }
.omr button.pend { border-color: var(--pick); border-style: dashed; color: var(--pick); }
.omr button.none { border-color: var(--bad); border-style: dashed; color: var(--bad); }
.omr button.cur { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(5, 15, 30, 0.55); }
.sheet-panel {
  position: relative;
  width: 100%;
  max-width: 760px;
  max-height: 80%;
  overflow: auto;
  background: var(--surface);
  border-radius: 14px 14px 0 0;
  padding-top: 14px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }

.pane {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.pane h2 { margin: 0; font-size: 20px; }
.pane p { margin: 0; }
.todo { display: flex; flex-wrap: wrap; gap: 6px; }
.todo button { min-width: 44px; }

.score {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 16px 14px;
  display: grid;
  gap: 10px;
}
.score-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.score-lbl { font-size: 14px; color: var(--muted); letter-spacing: 0.06em; }
.score-num {
  font-family: var(--font-mono);
  font-size: 52px;
  line-height: 1;
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.score-num small { font-size: 24px; color: var(--muted); font-weight: 500; }
.score-pt { font-size: 14px; color: var(--muted); }
.score-sub { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.score-sub div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  color: var(--muted);
}
.score-sub b { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.score-sub .ok { background: var(--ok-bg); border-color: var(--ok); }
.score-sub .ok b { color: var(--ok); }
.score-sub .part { border-color: var(--warn); }
.score-sub .part b { color: var(--warn); }
.score-sub .bad { background: var(--bad-bg); border-color: var(--bad); }
.score-sub .bad b { color: var(--bad); }
.score-track { height: 8px; border-radius: 4px; background: var(--bad-bg); overflow: hidden; }
.score-track i { display: block; height: 100%; background: var(--accent); }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.err { color: var(--bad); }

.pbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  background: var(--fg);
  color: var(--bg);
  display: grid;
  gap: 6px;
  padding-top: 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pbar-t { font-size: 12px; }
.pbar-in { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pbar select {
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  min-height: 38px;
}

/* 학번·이름 입력, 교사용 결과표 */
.idform { display: grid; gap: 10px; max-width: 420px; }
.idform label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.idform input {
  min-height: 48px;
  font-size: 18px;
  padding: 8px 12px;
  background: var(--surface);
  color: var(--fg);
  border: 2px solid var(--line);
  border-radius: 8px;
}
.idform input:focus { border-color: var(--pick); outline: none; }
.who { font-size: 14px; color: var(--muted); }
.who b { color: var(--fg); }
.linkbtn { background: none; border: 0; color: var(--pick); text-decoration: underline; cursor: pointer; padding: 4px; font-size: 14px; }
.subst { font-size: 13px; color: var(--muted); }
.subst.bad { color: var(--bad); }

.res { display: grid; gap: 12px; }
.res-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.res-hd h2 { margin: 0; font-size: 20px; margin-right: auto; }
.res-stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.res-stat div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); font-size: 13px; color: var(--muted); }
.res-stat b { display: block; font-family: var(--font-mono); font-size: 22px; color: var(--fg); }
.tbl { display: grid; gap: 6px; }
.trow {
  display: grid;
  grid-template-columns: 5.2em minmax(0, 1fr) auto auto;
  gap: 4px 10px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: left;
  width: 100%;
  cursor: pointer;
}
.trow.head { background: transparent; border: 0; cursor: default; font-size: 12px; color: var(--muted); padding-block: 0; }
.trow .sc { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.trow .pend { font-size: 12px; color: var(--warn); }
.trow.open { border-color: var(--pick); }
.detail { background: var(--surface); border: 1px solid var(--pick); border-radius: 8px; padding: 10px 12px; display: grid; gap: 10px; margin-top: -2px; }
.detail h3 { margin: 0; font-size: 15px; }
.eitem { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; }
.eitem .k { font-size: 12px; color: var(--muted); }
.eitem .v { white-space: pre-wrap; }
.adj { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.adj .btn { min-height: 34px; padding: 4px 10px; }
.adj .btn.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rate { display: grid; grid-template-columns: 3em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; font-size: 14px; }
.rate .bar2 { height: 8px; background: var(--bad-bg); border-radius: 4px; overflow: hidden; }
.rate .bar2 i { display: block; height: 100%; background: var(--accent); }
.rate .nm { font-family: var(--font-mono); }
.rate .pc { font-family: var(--font-mono); text-align: right; }
.rate .qq { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -4px; }

@media (max-width: 420px) {
  .clock b { font-size: 26px; }
  h1 { font-size: 16px; }
  .rules { grid-template-columns: 1fr; }
  .qt { font-size: 17px; }
}
</style>

</head><body>
<header class="top" id="top">
  <div class="top-in">
    <div class="ident">
      <span class="kicker">생물의 유전 · 보충 수업</span>
      <h1 id="setTitle">불러오는 중</h1>
    </div>
    <div class="clock" id="clock">
      <span id="clockLbl">대기</span>
      <b id="clockVal">30:00</b>
    </div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="tbar" id="tbar" hidden>
    <div class="tbar-in">
      <label for="selSet">회차</label>
      <select id="selSet">
        <option value="1">1회차 · 멘델의 법칙</option>

<script>
(function () {
  var DATA = {"1":{"short":"멘델의 법칙과 유전자형 추론","topics":["멘델의 완두 실험: 우열의 원리와 분리의 법칙","유전자형·표현형, 검정교배와 확률 계산","불완전 우성"],"questions":[{"tag":"유전의 기본 용어","q":"완두 씨의 모양과 색깔 중에서 서로 대립형질끼리 짝지은 것은?","c":["둥근 것 - 주름진 것","둥근 것 - 노란색","노란색 - 키 큰 것","주름진 것 - 초록색"],"a":1,"ex":"대립형질은 하나의 형질에 대해 서로 다르게 나타나는 형질이다. 씨 모양은 둥근 것과 주름진 것이, 씨 색깔은 노란색과 초록색이 서로 대립형질이다."},{"tag":"유전자형","q":"둥근 모양 유전자를 R, 주름진 모양 유전자를 r라고 할 때, 순종인 둥근 완두의 유전자형은?","c":["RR","Rr","R","rr"],"a":1,"ex":"순종은 같은 대립유전자가 쌍을 이루므로 둥근 완두 순종은 RR이다. Rr은 잡종이며 겉으로는 둥글게 나타난다."},{"tag":"유전자형과 표현형","q":"둥근 모양 유전자를 R, 주름진 모양 유전자를 r라고 할 때, 다음 중 표현형에 해당하는 것은?","c":["Rr","rr","둥근 모양","RR"],"a":3,"ex":"표현형은 겉으로 드러나는 형질이고, 유전자형은 유전자의 조합을 기호로 나타낸 것이다. Rr, RR, rr은 유전자형이고 둥근 모양이 표현형이다."},{"tag":"우열의 원리","q":"순종의 둥근 완두(RR)와 순종의 주름진 완두(rr)를 교배하여 얻은 잡종 1대의 표현형은?","c":["둥근 완두 : 주름진 완두 = 3 : 1","모두 둥근 완두","둥근 완두 : 주름진 완두 = 1 : 1","모두 주름진 완두"],"a":2,"ex":"둥근 모양이 우성이므로 잡종 1대는 모두 둥근 완두이다. 이것이 우열의 원리이다."},{"tag":"우열의 원리","q":"순종의 둥근 완두(RR)와 순종의 주름진 완두(rr)를 교배하여 얻은 잡종 1대의 유전자형은?","c":["RR","RR와 rr가 1 : 1","rr","Rr"],"a":4,"ex":"한쪽 부모에게서 R를, 다른 쪽 부모에게서 r를 받으므로 잡종 1대는 모두 Rr이다."},{"tag":"분리의 법칙","q":"잡종 1대(Rr)를 자가수분하여 얻은 잡종 2대에서 표현형의 분리비(둥근 완두 : 주름진 완두)는?","c":["1 : 1","2 : 1","3 : 1","1 : 3"],"a":3,"ex":"잡종 2대의 유전자형은 RR : Rr : rr = 1 : 2 : 1이고, RR와 Rr은 모두 둥글게 나타나므로 표현형은 둥근 것 : 주름진 것 = 3 : 1이다."},{"tag":"분리의 법칙","q":"잡종 1대(Rr)를 자가수분하여 얻은 잡종 2대의 유전자형 분리비(RR : Rr : rr)는?","c":["1 : 1 : 1","3 : 1 : 0","2 : 1 : 1","1 : 2 : 1"],"a":4,"ex":"Rr에서 R와 r가 1 : 1로 만들어지는 생식세포가 무작위로 만나므로 RR : Rr : rr = 1 : 2 : 1이 된다."},{"tag":"생식세포","q":"유전자형이 Rr인 개체가 만드는 생식세포의 종류와 비율은?","c":["R만 100 %","Rr 한 종류","R : r = 3 : 1","R : r = 1 : 1"],"a":4,"ex":"감수분열로 생식세포를 만들 때 대립유전자 R와 r가 분리되므로 R를 가진 생식세포와 r를 가진 생식세포가 1 : 1로 만들어진다."},{"tag":"비율 계산","q":"잡종 2대에서 둥근 완두가 1500개 얻어졌다면, 주름진 완두는 약 몇 개 얻어지겠는가?","c":["250개","375개","500개","1500개"],"a":3,"ex":"둥근 완두 : 주름진 완두 = 3 : 1이므로 주름진 완두는 1500 × 1/3 = 500개이다."},{"tag":"비율 계산","q":"잡종 2대의 둥근 완두 중에서 순종이 차지하는 비율은?","c":["1/3","1/2","2/3","3/4"],"a":1,"ex":"둥근 완두의 유전자형은 RR : Rr = 1 : 2이다. 따라서 둥근 완두 중 순종(RR)은 1/3이다."},{"tag":"우성과 열성","q":"완두의 씨 색깔에서 노란색(Y)이 초록색(y)에 대해 우성이다. 표현형이 초록색인 완두의 유전자형은?","c":["yy","Yy","YY 또는 Yy","YY"],"a":1,"ex":"열성 형질은 열성 유전자가 쌍으로 있을 때만 나타난다. 따라서 초록색 완두의 유전자형은 yy 한 가지이다."},{"tag":"우열의 원리","q":"잡종 1대에서 열성 형질이 나타나지 않는 까닭으로 가장 알맞은 것은?","c":["열성 유전자가 생식세포를 만드는 과정에서 사라졌기 때문이다.","열성 유전자가 우성 유전자에 가려져 겉으로 나타나지 않기 때문이다.","열성 유전자가 우성 유전자로 바뀌었기 때문이다.","열성 유전자는 자손에게 전달되지 않기 때문이다."],"a":2,"ex":"열성 유전자는 사라지지 않고 몸속에 그대로 있으며, 우성 유전자에 가려져 겉으로 나타나지 않을 뿐이다. 잡종 2대에서 다시 열성 형질이 나타나는 것이 그 증거이다."},{"tag":"멘델의 실험 과정","q":"멘델의 완두 교배 실험 과정을 순서대로 나열한 것은?","box":"(가) 순종의 둥근 완두와 순종의 주름진 완두를 타가수분시킨다.\n(나) 잡종 2대의 표현형을 조사한다.\n(다) 잡종 1대를 자가수분시킨다.\n(라) 잡종 1대의 표현형을 조사한다.","c":["(가) → (나) → (다) → (라)","(가) → (다) → (라) → (나)","(가) → (라) → (다) → (나)","(다) → (가) → (라) → (나)"],"a":3,"ex":"순종끼리 교배(가)하여 잡종 1대를 얻고 그 표현형을 조사(라)한 뒤, 잡종 1대를 자가수분(다)하여 얻은 잡종 2대의 표현형을 조사(나)한다."},{"tag":"검정교배","q":"검정교배를 하는 목적으로 옳은 것은?","c":["우성 형질을 가진 개체의 수를 늘리기 위해서이다.","표현형이 우성인 개체의 유전자형을 알아내기 위해서이다.","새로운 형질을 만들어 내기 위해서이다.","표현형이 열성인 개체의 유전자형을 알아내기 위해서이다."],"a":2,"ex":"우성 표현형은 유전자형이 순종(RR)인지 잡종(Rr)인지 겉모습으로는 알 수 없다. 이를 알아내려고 하는 교배가 검정교배이다."},{"tag":"검정교배","q":"둥근 완두(유전자형을 모름)를 주름진 완두와 교배하였더니 자손이 모두 둥근 완두였다. 이 둥근 완두의 유전자형은?","c":["Rr","rr","RR","알 수 없다"],"a":3,"ex":"둥근 완두가 Rr이었다면 자손의 절반은 주름진 완두였을 것이다. 자손이 모두 둥글었으므로 R만 만드는 RR이다."},{"tag":"검정교배","q":"둥근 완두(유전자형을 모름)를 주름진 완두와 교배하였더니 자손의 표현형 비가 둥근 완두 : 주름진 완두 = 1 : 1이었다. 이 둥근 완두의 유전자형은?","c":["RR","rr","알 수 없다","Rr"],"a":4,"ex":"주름진 자손(rr)이 나오려면 둥근 완두가 r를 가지고 있어야 한다. R와 r를 1 : 1로 만드는 Rr이다."},{"tag":"부모 유전자형 추론","q":"키 큰 완두(T)와 키 큰 완두를 교배하여 얻은 자손의 표현형이 키 큰 것 : 키 작은 것 = 3 : 1이었다. 부모의 유전자형은?","c":["Tt × Tt","Tt × tt","TT × tt","TT × Tt"],"a":1,"ex":"표현형 비 3 : 1은 이형접합끼리 교배했을 때 나타난다. 부모는 모두 Tt이다."},{"tag":"부모 유전자형 추론","q":"키 큰 완두와 키 작은 완두를 교배하여 얻은 자손의 표현형이 키 큰 것 : 키 작은 것 = 1 : 1이었다. 부모의 유전자형은?","c":["TT × Tt","Tt × Tt","Tt × tt","TT × tt"],"a":3,"ex":"키 작은 부모는 tt이다. 자손에 키 작은 것이 1/2 나오려면 키 큰 부모가 T와 t를 모두 가진 Tt이어야 한다."},{"tag":"부모 유전자형 추론","q":"둥근 완두끼리 교배하였더니 주름진 완두가 나타났다. 이에 대한 설명으로 옳은 것은?","c":["부모는 모두 Rr이며 둥근 모양이 우성이다.","부모 중 한쪽만 Rr이다.","부모는 모두 RR이다.","둥근 모양이 열성 형질이다."],"a":1,"ex":"같은 표현형의 부모에게서 다른 표현형의 자손이 나오면 부모의 표현형이 우성이고 부모는 모두 이형접합이다. 주름진 자손(rr)은 부모 양쪽에서 r를 받아야 한다."},{"tag":"확률 계산","q":"Rr × Rr를 교배했을 때 자손이 둥근 완두일 확률은?","c":["1/4","1/2","3/4","1"],"a":3,"ex":"자손의 유전자형 비는 RR : Rr : rr = 1 : 2 : 1이고 RR와 Rr가 둥근 완두이므로 확률은 3/4이다."},{"tag":"확률 계산","q":"Rr × Rr를 교배하여 얻은 자손 중 둥근 완두 하나를 골랐을 때, 그것이 Rr일 확률은?","c":["1/4","1/3","1/2","2/3"],"a":4,"ex":"둥근 완두의 유전자형은 RR : Rr = 1 : 2이므로 Rr일 확률은 2/3이다. 전체(4)가 아니라 둥근 완두(3) 중에서 비율을 구해야 한다."},{"tag":"확률 계산","q":"Rr × Rr를 교배했을 때, 태어난 두 자손이 모두 주름진 완두일 확률은?","c":["1/16","1/8","1/4","1/2"],"a":1,"ex":"자손 하나가 주름질 확률은 1/4이다. 서로 독립인 사건이므로 두 자손이 모두 주름질 확률은 1/4 × 1/4 = 1/16이다."},{"tag":"확률 계산","q":"Rr × Rr를 교배했을 때, 첫째 자손은 둥근 완두이고 둘째 자손은 주름진 완두일 확률은?","c":["1/16","3/16","1/4","3/4"],"a":2,"ex":"첫째가 둥글 확률 3/4과 둘째가 주름질 확률 1/4을 곱하면 3/16이다."},{"tag":"불완전 우성","q":"붉은색 분꽃(RR)과 흰색 분꽃(WW)을 교배하면 잡종 1대에서 모두 분홍색 꽃이 핀다. 이러한 현상이 나타나는 까닭은?","c":["붉은색이 우성이기 때문이다.","어느 대립유전자도 다른 쪽을 완전히 가리지 못해 중간 형질이 나타나기 때문이다.","흰색이 우성이기 때문이다.","돌연변이가 일어났기 때문이다."],"a":2,"ex":"이처럼 대립유전자 사이에 완전한 우열 관계가 없어 중간 형질이 나타나는 현상을 불완전 우성(중간 유전)이라고 한다."},{"tag":"불완전 우성","q":"분홍색 분꽃(RW)끼리 교배했을 때 자손의 표현형 비(붉은색 : 분홍색 : 흰색)는?","c":["3 : 1 : 0","1 : 1 : 1","2 : 1 : 1","1 : 2 : 1"],"a":4,"ex":"자손의 유전자형은 RR : RW : WW = 1 : 2 : 1이고, 불완전 우성에서는 유전자형마다 표현형이 다르므로 표현형 비도 1 : 2 : 1이다."},{"tag":"다른 생물의 유전","q":"털 색이 검은색인 쥐가 흰색인 쥐에 대해 우성이다(검은색 B, 흰색 b). 검은 쥐와 흰 쥐를 교배하였더니 검은 새끼 6마리와 흰 새끼 6마리가 태어났다. 검은 쥐 부모의 유전자형은?","c":["BB 또는 bb","BB","bb","Bb"],"a":4,"ex":"흰 새끼(bb)가 태어났으므로 검은 쥐는 b를 가지고 있다. 검은색과 흰색이 1 : 1이므로 Bb이다."},{"tag":"다른 생물의 유전","q":"털 색이 검은색인 쥐가 흰색인 쥐에 대해 우성일 때(검은색 B, 흰색 b), 검은 쥐끼리 교배하여 흰 새끼가 태어났다면 부모의 유전자형은?","c":["BB × Bb","Bb × Bb","BB × BB","Bb × bb"],"a":2,"ex":"흰 새끼(bb)는 부모 양쪽에서 b를 받아야 한다. 부모가 모두 검은색이므로 두 쥐 모두 Bb이다."},{"type":"short","tag":"우성과 열성","q":"서로 다른 순종의 대립형질을 교배하여 얻은 잡종 1대에서 겉으로 나타나는 형질을 무엇이라 하는지 쓰시오.","ans":["우성","우성 형질","우성형질"],"model":"우성","ci":true,"hint":"두 글자로 쓴다.","ex":"잡종 1대에서 겉으로 나타나는 형질을 우성이라 하고, 나타나지 않는 형질을 열성이라 한다."},{"type":"short","tag":"동형접합과 이형접합","q":"유전자형이 Rr인 개체와 같이 서로 다른 대립유전자를 가진 상태를 무엇이라 하는지 쓰시오.","ans":["이형접합","이형 접합","이형접합자","이형접합체","헤테로"],"model":"이형접합","ci":true,"hint":"용어를 쓴다.","ex":"대립유전자의 구성이 서로 다른 상태를 이형접합이라 하고, RR이나 rr처럼 같은 상태를 동형접합이라 한다."},{"type":"essay","tag":"분리의 법칙","q":"분리의 법칙을 '대립유전자'와 '생식세포'라는 용어를 사용하여 서술하시오.","model":"쌍을 이루고 있는 대립유전자는 생식세포가 만들어질 때 서로 분리되어, 서로 다른 생식세포로 하나씩 들어간다.","rubric":["대립유전자가 쌍으로 존재한다고 서술했다","생식세포가 만들어질 때 대립유전자가 분리된다고 서술했다","분리된 대립유전자가 서로 다른 생식세포로 하나씩 들어간다고 서술했다"],"hint":"대립유전자가 언제, 어떻게 나뉘는지 쓴다.","ex":"예를 들어 Rr인 개체는 R를 가진 생식세포와 r를 가진 생식세포를 1 : 1의 비율로 만든다."}]},"2":{"short":"유전자와 염색체","topics":["염색체의 구조, 상동염색체, 성염색체와 핵형","체세포분열과 감수분열의 과정, 염색체 수 변화","염색체 수 이상"],"questions":[{"tag":"포함 관계","q":"다음 중 크기가 큰 것부터 작은 것의 순서로 옳게 나열한 것은?","c":["핵 → DNA → 염색체 → 유전자","핵 → 염색체 → DNA → 유전자","유전자 → DNA → 염색체 → 핵","염색체 → 핵 → DNA → 유전자"],"a":2,"ex":"세포의 핵 속에 염색체가 있고, 염색체는 DNA와 단백질로 이루어지며, DNA의 일부분이 유전자이다. 핵 > 염색체 > DNA > 유전자의 순서이다."},{"tag":"염색체와 염색사","q":"세포분열을 하지 않는 시기의 핵 속에서 DNA가 가는 실처럼 풀어져 있는 상태를 무엇이라 하는가?","c":["핵막","염색사","염색분체","염색체"],"a":2,"ex":"분열하지 않는 시기에는 DNA가 가는 실 모양의 염색사로 풀어져 있다. 세포분열 시기에는 염색사가 응축되어 막대 모양의 염색체가 된다."},{"tag":"염색체의 구조","q":"세포분열 전에 DNA가 복제되어 만들어진, 하나의 염색체를 이루는 두 가닥을 무엇이라 하는가?","c":["상동염색체","유전자좌","핵형","염색분체"],"a":4,"ex":"복제된 DNA로 이루어진 두 가닥의 염색체를 염색분체라고 한다. 두 염색분체의 유전 정보는 서로 같다."},{"tag":"상동염색체","q":"상동염색체에 대한 설명으로 옳은 것은?","c":["크기와 모양이 같은 염색체 한 쌍이며 부모에게서 하나씩 물려받은 것이다.","크기와 모양이 서로 다른 염색체 한 쌍이다.","성별을 결정하는 염색체이다.","하나의 염색체를 이루는 두 염색분체이다."],"a":1,"ex":"상동염색체는 체세포에서 쌍을 이루는 크기와 모양이 같은 두 염색체이다. 하나는 아버지에게서, 하나는 어머니에게서 물려받는다."},{"tag":"대립유전자의 위치","q":"상동염색체에서 대립유전자 R와 r는 어디에 위치하는가?","c":["각각 한 염색체 위의 같은 위치","상동염색체의 같은 위치","서로 다른 염색체의 다른 위치","세포질"],"a":2,"ex":"대립유전자는 상동염색체의 같은 위치에 있다. 한 상동염색체에 R, 다른 상동염색체에 r가 있으면 Rr이다."},{"tag":"염색체 수","q":"완두의 체세포에는 염색체가 14개 있다. 완두의 체세포에 들어 있는 상동염색체는 몇 쌍인가?","c":["14쌍","28쌍","7쌍","2쌍"],"a":3,"ex":"상동염색체는 쌍으로 존재하므로 14 ÷ 2 = 7쌍이다."},{"type":"short","tag":"염색체의 구조","q":"분열 시기의 염색체에서 두 염색분체가 붙어 있는 부분을 무엇이라 하는지 쓰시오.","ans":["동원체"],"model":"동원체","ci":true,"hint":"용어를 쓴다.","ex":"두 염색분체는 동원체에서 붙어 있다. 세포분열 때 방추사가 동원체에 붙는다."},{"tag":"사람의 염색체","q":"사람의 체세포에서 상염색체는 모두 몇 개인가?","c":["22개","23개","44개","46개"],"a":3,"ex":"사람의 체세포 염색체 46개 중 성염색체 2개를 뺀 44개(22쌍)가 상염색체이다."},{"tag":"성염색체","q":"사람의 성염색체 구성으로 옳은 것은?","c":["남자 XX, 여자 XX","남자 XY, 여자 XX","남자 XY, 여자 YY","남자 XX, 여자 XY"],"a":2,"ex":"남자의 성염색체는 XY, 여자의 성염색체는 XX이다."},{"tag":"사람의 염색체","q":"정상 남자의 체세포 염색체 구성을 옳게 나타낸 것은?","c":["44 + XY","44 + XX","22 + X","22 + XY"],"a":1,"ex":"남자의 체세포에는 상염색체 44개와 성염색체 XY가 있어 44 + XY로 나타낸다."},{"type":"short","tag":"사람의 염색체","q":"사람의 체세포에 들어 있는 상동염색체는 모두 몇 쌍인지 쓰시오.","ans":["23","23쌍"],"model":"23쌍","ci":true,"hint":"숫자를 쓴다. 단위는 써도 되고 안 써도 된다.","ex":"사람의 체세포에는 염색체가 46개 있고 상동염색체가 쌍을 이루므로 모두 23쌍이다."},{"tag":"핵형","q":"핵형 분석에 대한 설명으로 옳은 것은?","c":["DNA의 염기 서열을 해독하는 방법이다.","세포분열 속도를 측정하는 방법이다.","염색체를 크기와 모양에 따라 배열한 것으로 염색체 수와 구조를 확인할 수 있다.","단백질의 종류를 분석하는 방법이다."],"a":3,"ex":"핵형 분석은 분열 중인 세포의 염색체를 크기와 모양에 따라 짝지어 배열하여 염색체의 수와 모양, 성별, 이상 여부를 알아내는 방법이다."},{"tag":"염색체 이상","q":"터너 증후군인 사람의 체세포에는 성염색체가 X 하나뿐이다. 이 사람의 체세포 염색체 수는?","c":["45개","46개","47개","48개"],"a":1,"ex":"상염색체 44개와 성염색체 X 하나를 가지므로 염색체는 45개이다. 성염색체가 하나뿐이어서 여자의 특징을 보인다."},{"tag":"염색체 이상","q":"클라인펠터 증후군인 사람의 성염색체는 XXY이다. 이 사람의 체세포 염색체 구성과 염색체 수를 옳게 나타낸 것은?","c":["44 + XXY, 47개","44 + XXY, 46개","45 + XXY, 48개","44 + XY, 46개"],"a":1,"ex":"상염색체 44개에 성염색체 XXY 3개가 있으므로 염색체는 모두 47개이다. 감수분열 때 성염색체가 분리되지 않아 생기는 염색체 수 이상이다."},{"tag":"체세포분열","q":"체세포분열의 의의로 옳은 것은?","c":["생물의 생장과 상처 재생에 쓰인다.","생식세포를 만드는 과정이다.","염색체 수를 반으로 줄인다.","서로 다른 유전 정보를 가진 세포를 만든다."],"a":1,"ex":"체세포분열은 몸을 구성하는 세포 수를 늘려 생장하게 하고, 상처가 났을 때 세포를 새로 만들어 재생하게 한다."},{"tag":"체세포분열","q":"체세포분열이 한 번 일어나면 만들어지는 딸세포의 수와 염색체 수로 옳은 것은?","c":["딸세포 4개, 염색체 수는 모세포의 절반","딸세포 2개, 염색체 수는 모세포의 절반","딸세포 4개, 염색체 수는 모세포와 같다.","딸세포 2개, 염색체 수는 모세포와 같다."],"a":4,"ex":"체세포분열은 1회 분열하여 모세포와 유전 정보가 같은 딸세포 2개를 만든다. 염색체 수는 모세포와 같다."},{"tag":"체세포분열","q":"체세포분열의 분열기를 순서대로 옳게 나열한 것은?","c":["전기 → 후기 → 중기 → 말기","중기 → 전기 → 후기 → 말기","전기 → 말기 → 중기 → 후기","전기 → 중기 → 후기 → 말기"],"a":4,"ex":"체세포분열의 분열기는 전기 → 중기 → 후기 → 말기 순서로 진행된다."},{"tag":"체세포분열","q":"체세포분열 과정에서 염색체가 세포의 중앙(적도면)에 배열되는 시기는?","c":["말기","전기","후기","중기"],"a":4,"ex":"중기에는 염색체가 적도면에 배열되며 염색체의 모양을 가장 뚜렷하게 관찰할 수 있다."},{"tag":"염색체 수 계산","q":"체세포의 염색체 수가 6개인 생물의 세포가 DNA를 복제한 직후에 가지는 염색체 수와 염색분체 수는?","c":["염색체 12개, 염색분체 12개","염색체 6개, 염색분체 12개","염색체 6개, 염색분체 6개","염색체 12개, 염색분체 6개"],"a":2,"ex":"DNA가 복제되어도 염색체 수는 6개 그대로이다. 각 염색체가 두 염색분체로 이루어지므로 염색분체는 12개이다."},{"type":"short","tag":"체세포분열","q":"핵막이 사라지고 DNA가 응축되어 염색체가 나타나기 시작하는 체세포분열의 시기를 쓰시오.","ans":["전기"],"model":"전기","ci":true,"hint":"분열기의 이름을 쓴다.","ex":"전기에는 핵막이 사라지고 DNA가 응축되어 막대 모양의 염색체가 나타나기 시작한다."},{"tag":"감수분열","q":"감수분열이 일어나는 곳과 그 결과로 만들어지는 세포를 옳게 짝지은 것은?","c":["피부 - 피부 세포","뼈 - 뼈 세포","생식 기관 - 생식세포","근육 - 근육 세포"],"a":3,"ex":"감수분열은 생식 기관에서 생식세포(정자, 난자 등)를 만드는 분열이다."},{"tag":"감수분열","q":"감수분열의 결과 딸세포의 염색체 수는 모세포에 비해 어떻게 변하는가?","c":["2배가 된다.","절반이 된다.","같다.","4배가 된다."],"a":2,"ex":"감수분열에서는 DNA 복제가 1회, 분열이 2회 일어나므로 염색체 수가 모세포의 절반이 된다."},{"tag":"감수분열","q":"감수 1분열에서 일어나는 일로 옳은 것은?","c":["염색분체가 분리되어 양극으로 이동한다.","DNA가 다시 복제된다.","상동염색체가 분리되어 양극으로 이동한다.","염색체 수가 두 배로 늘어난다."],"a":3,"ex":"감수 1분열에서는 상동염색체끼리 접합한 뒤 분리되어 서로 다른 딸세포로 들어간다. 이때 염색체 수가 절반이 된다."},{"tag":"감수분열","q":"감수 2분열에서 일어나는 일로 옳은 것은?","c":["염색체 수가 절반으로 줄어든다.","DNA가 복제된다.","염색분체가 분리되어 양극으로 이동한다.","상동염색체가 분리된다."],"a":3,"ex":"감수 2분열은 체세포분열과 비슷하게 염색분체가 분리되는 단계이다. 이때는 DNA 복제가 일어나지 않는다."},{"tag":"감수분열","q":"상동염색체끼리 접합하여 2가 염색체를 형성하는 시기는?","c":["체세포분열 전기","감수 2분열 중기","감수 2분열 후기","감수 1분열 전기"],"a":4,"ex":"감수 1분열 전기에는 상동염색체가 서로 접합하여 2가 염색체를 이룬다. 체세포분열에서는 접합이 일어나지 않는다."},{"type":"short","tag":"감수분열","q":"염색체 수가 모세포의 절반으로 줄어드는 시기를 감수 1분열과 감수 2분열 중에서 골라 쓰시오.","ans":["감수1분열","감수제1분열","제1분열","1분열","감수Ⅰ분열","감수I분열"],"model":"감수 1분열","ci":true,"hint":"어느 분열인지 쓴다.","ex":"감수 1분열에서 상동염색체가 분리되어 서로 다른 딸세포로 들어가므로 염색체 수가 절반으로 줄어든다."},{"tag":"비교","q":"체세포분열과 감수분열에 대한 설명으로 옳은 것은?","c":["체세포분열의 딸세포는 모세포와 유전 정보가 같다.","두 분열 모두 분열 전에 DNA 복제가 일어나지 않는다.","감수분열의 딸세포는 모두 서로 유전 정보가 같다.","두 분열 모두 딸세포의 염색체 수가 모세포와 같다."],"a":1,"ex":"체세포분열의 딸세포는 모세포와 유전 정보가 같다. 감수분열의 딸세포는 염색체 수가 절반이고 서로 유전 정보가 다를 수 있으며, 두 분열 모두 분열 전에 DNA가 복제된다."},{"tag":"생식세포의 다양성","q":"체세포의 염색체 수가 4개(상동염색체 2쌍)인 생물이 만들 수 있는 생식세포의 염색체 조합은 최대 몇 가지인가? (교차는 고려하지 않는다.)","c":["2가지","3가지","8가지","4가지"],"a":4,"ex":"상동염색체 한 쌍마다 어느 쪽이 들어가는지 2가지씩이므로 2 × 2 = 4가지이다."},{"type":"essay","tag":"성 결정","q":"사람에서 자녀의 성별이 아버지가 만드는 정자의 성염색체에 의해 결정되는 까닭을 어머니가 만드는 난자의 성염색체와 비교하여 서술하시오.","model":"어머니의 성염색체는 XX이므로 난자는 모두 X 염색체를 가진다. 아버지의 성염색체는 XY이므로 X 염색체를 가진 정자와 Y 염색체를 가진 정자를 만든다. 따라서 X 염색체를 가진 정자가 수정되면 딸이, Y 염색체를 가진 정자가 수정되면 아들이 태어난다.","rubric":["난자는 모두 X 염색체를 가진다고 서술했다","정자는 X 염색체를 가진 것과 Y 염색체를 가진 것 두 종류라고 서술했다","수정에 쓰인 정자의 성염색체에 따라 성별이 결정된다고 서술했다"],"hint":"난자와 정자가 가지는 성염색체의 종류를 비교하여 쓴다.","ex":"난자는 항상 X 염색체만 가지므로 자녀의 성별은 어떤 정자가 수정되는지에 따라 결정된다."},{"type":"essay","tag":"생식세포의 다양성","q":"같은 사람이 만든 생식세포들의 유전 정보가 서로 다를 수 있는 까닭을 감수분열 과정과 관련지어 서술하시오.","model":"감수 1분열에서 상동염색체가 무작위로 나뉘어 생식세포마다 염색체 조합이 달라지고, 상동염색체 사이에서 교차가 일어나 유전자 조합도 달라지기 때문이다.","rubric":["감수 1분열에서 상동염색체가 분리된다고 서술했다","상동염색체가 무작위로 나뉘어 염색체 조합이 다양해진다고 서술했다","교차(유전자 교환)가 일어난다고 서술했다"],"hint":"염색체의 분리 방식과 교차를 함께 쓴다.","ex":"염색체 조합이 달라지는 것과 교차가 일어나는 것이 생식세포의 다양성을 만든다."}]},"3":{"short":"DNA 복제 입문","topics":["DNA의 구조와 염기쌍, 상보 가닥","반보존적 복제와 메셀슨·스탈 실험","5′ 말단과 3′ 말단, 주형 가닥과 새 가닥의 방향"],"questions":[{"tag":"유전 물질","q":"유전 정보를 저장하고 있는 물질은?","c":["지방","단백질","녹말","DNA"],"a":4,"ex":"유전 정보는 DNA에 저장되어 있다. DNA에는 단백질을 만드는 정보가 염기 서열의 형태로 담겨 있다."},{"tag":"유전자","q":"유전자에 대한 설명으로 옳은 것은?","c":["세포질에 들어 있는 단백질이다.","염색체와 같은 말이다.","DNA에서 특정 형질에 대한 정보를 담고 있는 부분이다.","한 개의 염색체에는 유전자가 한 개만 있다."],"a":3,"ex":"유전자는 DNA의 일부분으로 하나의 형질에 대한 유전 정보를 담고 있다. 하나의 염색체에는 수많은 유전자가 들어 있다."},{"tag":"DNA 구조","q":"DNA를 이루는 염기의 종류를 옳게 나타낸 것은?","c":["A, T, G, C","A, U, G, C","A, T, G, U","T, U, G, C"],"a":1,"ex":"DNA의 염기는 아데닌(A), 타이민(T), 구아닌(G), 사이토신(C)의 4종류이다. 유라실(U)은 RNA에 들어 있는 염기이다."},{"tag":"DNA 구조","q":"DNA의 염기쌍 결합으로 옳은 것은?","c":["A-G, T-C","A-T, G-C","A-C, T-G","A-A, T-T"],"a":2,"ex":"DNA에서는 A와 T, G와 C가 서로 짝을 이루어 결합한다. 이를 상보적 결합이라고 한다."},{"tag":"DNA 구조","q":"DNA의 한 가닥의 염기 서열이 TACG일 때, 이와 상보적으로 결합하는 다른 가닥의 염기 서열은?","c":["CGTA","TACG","ATGG","ATGC"],"a":4,"ex":"T-A, A-T, C-G, G-C로 결합하므로 상보 가닥은 ATGC이다."},{"tag":"DNA 구조","q":"이중 가닥 DNA 한 분자에서 염기 A가 전체 염기의 30 %를 차지한다면, 염기 G의 비율은?","c":["10 %","30 %","40 %","20 %"],"a":4,"ex":"A와 T는 같은 수이므로 T도 30 %이다. 나머지 40 %를 G와 C가 나누어 가지므로 G는 20 %이다."},{"tag":"DNA 구조","q":"DNA의 입체 구조를 옳게 설명한 것은?","c":["단일 가닥으로 직선 모양이다.","세 가닥이 꼬인 구조이다.","이중 나선 구조이다.","고리 하나로 이루어진 구 모양이다."],"a":3,"ex":"DNA는 두 가닥이 나선 모양으로 꼬여 있는 이중 나선 구조이다. 1953년 왓슨과 크릭이 밝혔다."},{"tag":"유전자와 DNA","q":"DNA와 유전자에 대한 설명으로 옳은 것은?","c":["유전자는 DNA와 별개로 세포질에 들어 있다.","한 개의 DNA에는 많은 수의 유전자가 있으며 DNA에는 유전자가 아닌 부분도 있다.","DNA와 유전자는 같은 것이다.","한 개의 DNA에는 유전자가 한 개만 있다."],"a":2,"ex":"DNA 한 분자에는 수많은 유전자가 들어 있다. 또한 DNA에는 유전자로 작용하지 않는 부분도 있다."},{"tag":"DNA 복제","q":"세포분열을 하기 전에 DNA가 복제되는 까닭으로 가장 알맞은 것은?","c":["딸세포가 모세포와 같은 유전 정보를 가지게 하기 위해서이다.","세포의 크기를 키우기 위해서이다.","딸세포의 염색체 수를 두 배로 늘리기 위해서이다.","새로운 유전 정보를 만들기 위해서이다."],"a":1,"ex":"분열 전에 DNA를 복제해 두어야 분열 후 두 딸세포가 모세포와 같은 유전 정보를 나누어 가질 수 있다."},{"tag":"DNA 복제","q":"DNA 복제가 일어나는 시기로 옳은 것은?","c":["분열기 중기","간기(S기)","분열기 전기","분열기 후기"],"a":2,"ex":"DNA 복제는 세포가 분열하기 전의 간기(S기)에 일어난다. 복제된 DNA는 분열기에 염색분체로 나뉘어 두 딸세포에 하나씩 들어간다."},{"tag":"반보존적 복제","q":"반보존적 복제에 대한 설명으로 옳은 것은?","c":["복제된 두 DNA 분자는 모두 새로 합성된 가닥으로만 이루어진다.","원래 DNA는 그대로 보존되고 완전히 새로운 DNA가 하나 만들어진다.","복제로 만들어진 두 DNA 분자는 각각 원래 DNA의 한 가닥과 새로 합성된 한 가닥으로 이루어진다.","원래 DNA의 두 가닥이 짧은 조각으로 끊어진 뒤 새 조각과 섞여 이어진다."],"a":3,"ex":"반보존적 복제에서는 원래 DNA의 두 가닥이 각각 주형이 되어 새 가닥이 합성된다. 따라서 새로 만들어진 DNA 두 분자는 모두 옛 가닥 하나와 새 가닥 하나로 이루어진다. 원래 DNA가 그대로 보존된다는 설명은 보존적 복제 가설이고, 짧은 조각으로 끊어져 섞인다는 설명은 분산적 복제 가설이다."},{"tag":"메셀슨·스탈 실험","q":"메셀슨과 스탈은 15N가 들어 있는 배지에서 대장균을 여러 세대 키운 뒤 14N 배지로 옮겨 한 번 분열시켰다. 이때 대장균 DNA의 밀도로 옳은 것은? (15N은 무거운 질소, 14N은 가벼운 질소이며 DNA는 반보존적으로 복제된다.)","c":["모두 가벼운 DNA(14N/14N)","무거운 DNA와 가벼운 DNA가 1 : 1","모두 무거운 DNA(15N/15N)","모두 중간 DNA(15N/14N)"],"a":4,"ex":"처음 DNA는 두 가닥이 모두 15N이다. 반보존적으로 복제되면 옛 가닥(15N) 하나와 새 가닥(14N) 하나를 가진 DNA가 만들어지므로 모두 중간 밀도이다."},{"tag":"메셀슨·스탈 실험","q":"위 실험에서 14N 배지로 옮긴 뒤 두 번 분열시켰을 때 DNA 밀도의 비로 옳은 것은? (DNA는 반보존적으로 복제된다.)","c":["무거운 DNA : 가벼운 DNA = 1 : 1","중간 DNA만 나타난다.","중간 DNA : 가벼운 DNA = 1 : 3","중간 DNA : 가벼운 DNA = 1 : 1"],"a":4,"ex":"두 번 복제하면 DNA는 4분자가 된다. 옛 15N 가닥 두 개는 서로 다른 분자에 들어가 중간 DNA가 2분자이고, 나머지 2분자는 가벼운 DNA이므로 1 : 1이다."},{"tag":"메셀슨·스탈 실험","q":"15N 배지에서 키운 대장균을 14N 배지로 옮겨 세 번 분열시켰을 때, 전체 DNA 중 가벼운 DNA(14N/14N)가 차지하는 비율은? (DNA는 반보존적으로 복제된다.)","c":["1/4","1/2","3/4","1"],"a":3,"ex":"세 번 복제하면 DNA는 8분자가 된다. 15N 가닥이 들어 있는 중간 DNA는 항상 2분자이고 나머지 6분자가 가벼운 DNA이므로 비율은 6/8 = 3/4이다."},{"tag":"메셀슨·스탈 실험","q":"만약 DNA가 보존적으로 복제된다고 가정하면, 15N 배지에서 키운 대장균을 14N 배지로 옮겨 한 번 분열시킨 뒤의 DNA 밀도는?","c":["모두 무거운 DNA","무거운 DNA : 가벼운 DNA = 1 : 1이며 중간 DNA는 없다.","모두 중간 DNA","모두 가벼운 DNA"],"a":2,"ex":"보존적 복제는 원래 DNA는 그대로 두고 완전히 새로운 DNA가 만들어진다는 가설이다. 이 경우 무거운 DNA와 가벼운 DNA가 1 : 1로 나타나야 한다. 실제 실험에서는 중간 밀도의 띠가 나타나 이 가설이 기각되었다."},{"tag":"DNA 복제","q":"DNA 한 분자가 연속으로 4회 복제되면 만들어지는 DNA 분자의 수는?","c":["4개","8개","16개","32개"],"a":3,"ex":"복제가 한 번 일어날 때마다 DNA 분자 수가 2배가 된다. 4회 복제하면 2의 4제곱, 즉 16개가 된다."},{"tag":"복제와 뉴클레오타이드","q":"염기쌍 1000쌍으로 이루어진 이중 가닥 DNA가 한 번 복제될 때, 새로 연결되는 뉴클레오타이드는 모두 몇 개인가?","c":["1000개","2000개","3000개","4000개"],"a":2,"ex":"복제되면 원래 두 가닥 각각에 상보적인 새 가닥이 1000개의 뉴클레오타이드로 합성된다. 따라서 새로 연결되는 뉴클레오타이드는 1000 × 2 = 2000개이다."},{"tag":"복제와 뉴클레오타이드","q":"염기쌍 1000쌍으로 이루어진 이중 가닥 DNA가 연속으로 2회 복제되었다. 이 과정에서 새로 합성된 뉴클레오타이드는 모두 몇 개인가?","c":["2000개","4000개","6000개","8000개"],"a":3,"ex":"2회 복제하면 DNA는 4분자가 되고 뉴클레오타이드는 모두 4 × 2000 = 8000개이다. 처음 DNA의 뉴클레오타이드 2000개를 빼면 새로 합성된 것은 6000개이다."},{"tag":"5′ 말단과 3′ 말단","q":"DNA 한 가닥의 양 끝에 대한 설명으로 옳은 것은?","c":["5′ 말단에는 인산기가, 3′ 말단에는 하이드록시기(-OH)가 노출되어 있다.","5′ 말단에는 하이드록시기(-OH)가, 3′ 말단에는 인산기가 노출되어 있다.","두 말단 모두 인산기가 노출되어 있다.","두 말단 모두 하이드록시기(-OH)가 노출되어 있다."],"a":1,"ex":"뉴클레오타이드의 당에서 5번 탄소에는 인산기가, 3번 탄소에는 하이드록시기(-OH)가 붙어 있다. 그래서 한 가닥의 5′ 쪽 끝에는 인산기가, 3′ 쪽 끝에는 -OH가 노출된다."},{"tag":"5′ 말단과 3′ 말단","q":"DNA 중합효소가 새로운 뉴클레오타이드를 연결하는 곳은?","c":["주형 가닥의 5′ 말단","합성 중인 새 가닥의 5′ 말단","주형 가닥의 3′ 말단","합성 중인 새 가닥의 3′ 말단"],"a":4,"ex":"DNA 중합효소는 새 가닥의 3′ 말단에 있는 -OH에 새 뉴클레오타이드의 인산기를 결합시킨다. 그래서 새 가닥은 항상 3′ 쪽으로만 길어진다."},{"tag":"가닥의 방향성","q":"이중 가닥 DNA에서 두 가닥의 방향에 대한 설명으로 옳은 것은?","c":["DNA 가닥에는 방향이 없어 어느 쪽 끝이든 같다.","두 가닥은 서로 반대 방향으로 놓여 있어, 한 가닥의 5′ 쪽 끝은 다른 가닥의 3′ 쪽 끝과 같은 쪽에 있다.","두 가닥 모두 3′ 쪽 끝이 위쪽에 있다.","두 가닥은 같은 방향으로 놓여 있어, 두 가닥의 5′ 쪽 끝이 같은 쪽에 있다."],"a":2,"ex":"이중 가닥 DNA의 두 가닥은 서로 반대 방향으로 나란히 놓여 있다. 한 가닥을 5′→3′ 방향으로 읽으면 상보 가닥은 3′→5′ 방향으로 읽힌다."},{"tag":"상보 가닥의 말단","q":"5′-GTACCA-3′ 가닥과 상보적으로 결합하는 가닥에서 5′ 말단에 있는 염기는?","c":["G","C","T","A"],"a":3,"ex":"주어진 가닥의 상보 가닥은 3′-CATGGT-5′이다. 이 가닥의 5′ 말단은 오른쪽 끝이므로 염기는 T이다. 주어진 가닥의 3′ 말단 염기 A와 상보 결합하는 염기가 상보 가닥의 5′ 말단에 온다."},{"tag":"상보 가닥 쓰기","q":"주형 가닥의 염기 서열이 5′-GATTACA-3′일 때, 이를 주형으로 새로 합성되는 가닥의 염기 서열(5′→3′)은?","c":["5′-TGTAATC-3′","5′-CTAATGT-3′","5′-GATTACA-3′","5′-ACATTAG-3′"],"a":1,"ex":"각 염기에 상보적인 염기를 짝지으면 3′-CTAATGT-5′이다. 문제에서 요구한 5′→3′ 방향으로 고쳐 쓰려면 순서를 거꾸로 읽어야 하므로 5′-TGTAATC-3′이다."},{"tag":"상보 가닥 쓰기","q":"주형 가닥의 염기 서열이 3′-CCGATA-5′일 때, 이를 주형으로 새로 합성되는 가닥의 염기 서열(5′→3′)은?","c":["5′-GGCTAT-3′","5′-TATCGG-3′","5′-CCGATA-3′","5′-GGCUAU-3′"],"a":1,"ex":"주형이 3′→5′ 방향으로 적혀 있으므로 새 가닥은 왼쪽이 5′ 말단이다. 왼쪽부터 상보적인 염기를 쓰면 5′-GGCTAT-3′이다. DNA에는 U가 없고 T가 있다."},{"tag":"주형 가닥 찾기","q":"새로 합성된 가닥의 염기 서열이 5′-ATGGCA-3′일 때, 이 가닥의 주형이 된 가닥의 염기 서열은?","c":["5′-TACCGT-3′","5′-ACGGTA-3′","3′-ATGGCA-5′","3′-TACCGT-5′"],"a":4,"ex":"주형 가닥은 새 가닥과 상보적이며 방향이 반대이다. 새 가닥의 각 염기에 상보적인 염기를 쓰면 TACCGT이고, 새 가닥의 5′ 쪽에 놓이는 끝이 주형의 3′ 말단이므로 3′-TACCGT-5′이다."},{"tag":"DNA 구조","q":"DNA 이중 나선에서 두 가닥의 염기들 사이를 연결하는 결합은?","c":["수소 결합","펩타이드 결합","이온 결합","금속 결합"],"a":1,"ex":"상보적인 염기 사이에는 수소 결합이 형성된다. A과 T 사이에는 2개, G과 C 사이에는 3개의 수소 결합이 있다."},{"type":"short","tag":"상보 가닥 쓰기","q":"주형 가닥의 염기 서열이 3′-ATGCCGT-5′일 때, 새로 합성되는 가닥의 염기 서열을 5′→3′ 방향으로 쓰시오.","ans":["TACGGCA","5'-TACGGCA-3'"],"model":"5′-TACGGCA-3′","ci":true,"hint":"염기만 써도 되고 5′, 3′ 표시를 함께 써도 된다.","ex":"주형이 3′→5′ 방향으로 적혀 있으므로 왼쪽부터 상보적인 염기를 쓰면 새 가닥은 5′-TACGGCA-3′이다."},{"type":"short","tag":"상보 가닥 쓰기","q":"주형 가닥의 염기 서열이 5′-CCATGT-3′일 때, 새로 합성되는 가닥의 염기 서열을 5′→3′ 방향으로 쓰시오.","ans":["ACATGG","5'-ACATGG-3'"],"model":"5′-ACATGG-3′","ci":true,"hint":"염기만 써도 되고 5′, 3′ 표시를 함께 써도 된다.","ex":"상보적인 염기를 쓰면 3′-GGTACA-5′이다. 5′→3′ 방향으로 고쳐 쓰면 5′-ACATGG-3′이다."},{"type":"short","tag":"5′ 말단과 3′ 말단","q":"새 뉴클레오타이드가 연결될 때, 새 가닥의 3′ 말단에 노출되어 있어 연결에 이용되는 작용기의 이름을 쓰시오.","ans":["하이드록시기","하이드록실기","히드록시기","히드록실기","수산기","OH","hydroxyl"],"model":"하이드록시기(-OH)","ci":true,"hint":"작용기 이름을 쓴다.","ex":"새 가닥의 3′ 말단에는 하이드록시기(-OH)가 있다. 이 -OH에 새 뉴클레오타이드의 인산기가 결합하여 가닥이 길어진다."},{"type":"essay","tag":"반보존적 복제","q":"반보존적 복제의 의미를 '주형 가닥'과 '새로 합성된 가닥'이라는 용어를 사용하여 서술하시오.","model":"DNA가 복제될 때 원래 DNA의 두 가닥이 각각 주형 가닥이 되어 상보적인 새 가닥이 합성된다. 따라서 복제로 만들어진 두 DNA 분자는 각각 원래 DNA의 한 가닥과 새로 합성된 가닥 하나로 이루어진다.","rubric":["원래 DNA의 두 가닥이 각각 주형 가닥으로 쓰인다고 서술했다","새로 합성되는 가닥이 주형 가닥과 상보적으로 결합한다고 서술했다","복제된 DNA 분자가 각각 원래 가닥 하나와 새 가닥 하나로 이루어진다고 서술했다"],"hint":"주형 가닥과 새 가닥이 각각 어떻게 쓰이는지 쓴다.","ex":"반보존적 복제에서는 원래 DNA의 한 가닥이 새로 만들어진 DNA 분자에 그대로 보존된다. 이 사실이 메셀슨과 스탈의 실험으로 증명되었다."}]},"4":{"short":"DNA 복제 기초","topics":["복제 효소: 헬리케이스, DNA 중합효소, 연결효소","프라이머, 선도 가닥과 지연 가닥, 오카자키 절편","복제 원점과 복제의 정확성, 서열 쓰기 반복 연습"],"questions":[{"tag":"DNA 복제 효소","q":"DNA 복제 때 이중 나선을 풀어 염기 사이의 수소 결합을 끊어 두 가닥으로 분리하는 효소는?","c":["DNA 연결효소","헬리케이스","제한효소","DNA 중합효소"],"a":2,"ex":"헬리케이스가 두 가닥 사이의 수소 결합을 끊어 이중 나선을 푼다. 이때 Y자 모양으로 벌어진 부분을 복제 분기점(복제 포크)이라고 한다."},{"tag":"DNA 복제 효소","q":"주형 가닥의 염기와 상보적인 뉴클레오타이드를 차례로 연결하여 새로운 가닥을 합성하는 효소는?","c":["DNA 연결효소","헬리케이스","프라이머","DNA 중합효소"],"a":4,"ex":"DNA 중합효소가 주형 가닥을 따라 상보적인 염기를 가진 뉴클레오타이드를 하나씩 이어 붙여 새 가닥을 만든다. 프라이머는 효소가 아니라 합성을 시작하게 하는 짧은 핵산 조각이다."},{"tag":"DNA 복제 과정","q":"DNA 중합효소는 새 가닥을 5′ → 3′ 방향으로만 합성한다. 이 때문에 복제 분기점에서 나타나는 현상으로 옳은 것은?","c":["새 가닥은 5′ → 3′ 방향과 3′ → 5′ 방향으로 모두 합성된다.","두 새 가닥이 모두 짧은 조각으로만 합성된다.","두 새 가닥이 모두 연속적으로 합성된다.","한 가닥은 연속적으로(선도 가닥), 다른 가닥은 짧은 조각으로 불연속적으로(지연 가닥) 합성된다."],"a":4,"ex":"두 주형 가닥은 서로 반대 방향이므로, 복제 분기점이 벌어지는 방향과 같은 방향으로 합성되는 선도 가닥은 연속적으로, 반대 방향으로 합성되는 지연 가닥은 짧은 조각으로 합성된다."},{"tag":"DNA 복제 과정","q":"주형 가닥의 염기 서열이 3′-TACGGA-5′일 때, 이를 주형으로 새로 합성되는 가닥의 염기 서열은?","c":["5′-TACGGA-3′","5′-AUGCCU-3′","3′-ATGCCT-5′","5′-ATGCCT-3′"],"a":4,"ex":"새 가닥은 주형과 상보적이며 서로 반대 방향이다. T-A, A-T, C-G, G-C로 짝지으면 5′-ATGCCT-3′이 된다. 방향이 반대로 쓰인 것이나 RNA의 염기(U)가 들어간 것은 옳지 않다."},{"tag":"지연 가닥","q":"지연 가닥에서 오카자키 절편 하나를 DNA 중합효소가 합성하는 방향은?","c":["복제 분기점이 이동하는 방향과 같은 방향이며, 새 가닥의 5′→3′ 방향이다.","복제 분기점이 이동하는 방향과 반대 방향이며, 새 가닥의 3′→5′ 방향이다.","복제 분기점이 이동하는 방향과 반대 방향이며, 새 가닥의 5′→3′ 방향이다.","복제 분기점이 이동하는 방향과 같은 방향이며, 새 가닥의 3′→5′ 방향이다."],"a":3,"ex":"DNA 중합효소는 어떤 경우에도 새 가닥을 5′→3′ 방향으로만 합성한다. 지연 가닥의 주형은 이 방향으로 합성하면 복제 분기점이 이동하는 방향과 반대가 되므로, 절편마다 분기점에서 멀어지는 쪽으로 합성된다."},{"tag":"선도 가닥과 지연 가닥","q":"다음은 복제 분기점이 오른쪽으로 이동하며 이중 가닥 DNA가 풀리는 모습이다. 위쪽 주형 가닥은 왼쪽이 3′ 말단이고, 아래쪽 주형 가닥은 왼쪽이 5′ 말단이다. 각 주형 가닥에서 합성되는 새 가닥을 옳게 짝지은 것은?","c":["두 주형 가닥 모두에서 선도 가닥이 합성된다.","위쪽 주형 가닥에서는 지연 가닥이, 아래쪽 주형 가닥에서는 선도 가닥이 합성된다.","위쪽 주형 가닥에서는 선도 가닥이, 아래쪽 주형 가닥에서는 지연 가닥이 합성된다.","두 주형 가닥 모두에서 지연 가닥이 합성된다."],"a":3,"ex":"위쪽 주형은 왼쪽이 3′이므로 새 가닥은 왼쪽이 5′ 말단이 된다. 이 새 가닥은 오른쪽으로 합성되며, 이는 복제 분기점이 이동하는 방향과 같으므로 선도 가닥이다. 아래쪽 주형에서는 새 가닥이 왼쪽으로 합성되어야 하므로 분기점과 반대 방향이 되어 지연 가닥이다.","box":"3′ ─────────────────── 5′   위쪽 주형 가닥\n5′ ─────────────────── 3′   아래쪽 주형 가닥\n          복제 분기점 이동 방향 →"},{"tag":"선도 가닥과 지연 가닥","q":"다음은 복제 분기점이 왼쪽으로 이동하며 이중 가닥 DNA가 풀리는 모습이다. 위쪽 주형 가닥은 왼쪽이 5′ 말단이고, 아래쪽 주형 가닥은 왼쪽이 3′ 말단이다. 선도 가닥이 합성되는 주형 가닥은?","c":["두 주형 가닥 모두","아래쪽 주형 가닥","위쪽 주형 가닥","두 주형 가닥 모두 아니다."],"a":3,"ex":"위쪽 주형은 왼쪽이 5′이므로 새 가닥은 왼쪽이 3′ 말단이 된다. 새 가닥은 5′→3′ 방향으로 합성되므로 왼쪽으로 합성되며, 이는 복제 분기점의 이동 방향과 같으므로 선도 가닥이다.","box":"5′ ─────────────────── 3′   위쪽 주형 가닥\n3′ ─────────────────── 5′   아래쪽 주형 가닥\n← 복제 분기점 이동 방향"},{"tag":"DNA 중합효소","q":"DNA 중합효소가 새 가닥을 합성할 때 주형 가닥을 읽는 방향은?","c":["5′→3′ 방향","3′→5′ 방향","양쪽 방향을 번갈아 읽는다.","방향과 관계없이 읽는다."],"a":2,"ex":"새 가닥은 5′→3′ 방향으로 합성된다. 새 가닥과 주형 가닥은 서로 반대 방향이므로 DNA 중합효소는 주형 가닥을 3′→5′ 방향으로 읽는다."},{"tag":"5′ 말단과 3′ 말단","q":"주형 가닥의 3′ 말단 쪽에서 합성이 시작될 때, 새 가닥에서 가장 먼저 만들어지는 쪽의 말단은?","c":["양쪽 끝이 동시에 만들어진다.","3′ 말단","가운데 부분","5′ 말단"],"a":4,"ex":"새 가닥은 주형 가닥과 반대 방향으로 결합한다. 그래서 주형 가닥의 3′ 말단과 마주 보는 새 가닥의 끝은 5′ 말단이며, 이곳에서 합성이 시작되어 3′ 쪽으로 길어진다."},{"tag":"5′ 말단과 3′ 말단","q":"새 뉴클레오타이드가 새 가닥에 연결될 때, 새 가닥의 3′ 말단과 결합하는 새 뉴클레오타이드의 부분은?","c":["3′ 쪽 하이드록시기","염기 부분","5′ 쪽 인산기","오탄당의 수소 원자"],"a":3,"ex":"새 가닥의 3′ 말단에는 하이드록시기(-OH)가 있다. 새 뉴클레오타이드의 5′ 쪽 인산기가 여기에 결합하여 가닥이 길어진다."},{"tag":"DNA 복제 과정","q":"지연 가닥에서 만들어진 짧은 조각(오카자키 절편)들을 이어 붙여 하나의 가닥으로 만드는 효소는?","c":["헬리케이스","DNA 연결효소","DNA 중합효소","RNA 중합효소"],"a":2,"ex":"오카자키 절편은 지연 가닥에서 불연속적으로 만들어진 짧은 DNA 조각이다. DNA 연결효소가 이 조각들 사이를 이어 연속된 한 가닥으로 만든다."},{"tag":"DNA 복제 과정","q":"복제 분기점에서 지연 가닥의 합성에 대한 설명으로 옳은 것은?","c":["프라이머가 여러 번 필요하고 오카자키 절편이 만들어진다.","프라이머가 한 번만 필요하다.","DNA 연결효소가 필요하지 않다.","헬리케이스 없이도 합성된다."],"a":1,"ex":"지연 가닥은 짧은 조각으로 불연속적으로 합성되므로 조각마다 프라이머가 필요하고, 만들어진 오카자키 절편은 DNA 연결효소로 이어 붙인다."},{"tag":"DNA 복제 과정","q":"DNA 복제 과정에서 프라이머의 역할로 옳은 것은?","c":["DNA 중합효소가 새 가닥 합성을 시작할 수 있도록 3′ 말단을 제공한다.","염기 사이의 수소 결합을 끊는다.","이중 나선을 풀어 준다.","오카자키 절편을 서로 연결한다."],"a":1,"ex":"DNA 중합효소는 이미 있는 가닥의 3′ 말단에만 뉴클레오타이드를 붙일 수 있다. 프라이머는 이 시작점을 제공하는 짧은 핵산 조각이며, 복제가 끝나면 DNA로 대체된다."},{"tag":"프라이머","q":"지연 가닥이 10개의 오카자키 절편으로 합성될 때, 지연 가닥 합성에 필요한 프라이머는 최소 몇 개인가?","c":["1개","5개","10개","20개"],"a":3,"ex":"DNA 중합효소는 3′ 말단이 있어야 합성을 시작할 수 있다. 오카자키 절편은 각각 독립적으로 합성을 시작하므로 절편마다 프라이머가 하나씩 필요하다."},{"tag":"복제 효소","q":"프라이머가 제거된 빈 자리를 DNA 뉴클레오타이드로 채우는 효소는?","c":["헬리케이스","DNA 중합효소","DNA 연결효소","프라이머"],"a":2,"ex":"프라이머가 제거되면 그 자리가 비게 된다. 이 자리는 DNA 중합효소가 앞 절편의 3′ 말단에 뉴클레오타이드를 이어 채우고, 남은 틈은 DNA 연결효소가 연결한다."},{"tag":"프라이머","q":"한 복제 분기점에서 선도 가닥을 합성하는 데 필요한 프라이머는 최소 몇 개인가?","c":["1개","2개","5개","10개"],"a":1,"ex":"선도 가닥은 연속적으로 합성되므로 처음에 프라이머가 하나만 있으면 된다. 지연 가닥은 절편마다 프라이머가 필요하다."},{"tag":"프라이머","q":"프라이머 5′-CGTA-3′가 주형 가닥에 결합하였다. 프라이머와 결합한 주형 가닥 부분의 염기 서열은?","c":["3′-GCAT-5′","5′-GCAT-3′","3′-CGTA-5′","5′-ATGC-3′"],"a":1,"ex":"프라이머의 각 염기와 상보적인 염기는 G, C, A, T이므로 GCAT이다. 두 가닥은 서로 반대 방향이므로 주형 가닥은 3′-GCAT-5′이다."},{"tag":"오카자키 절편","q":"오카자키 절편에 대한 설명으로 옳은 것은?","c":["선도 가닥에서 연속적으로 합성되는 긴 DNA이다.","지연 가닥에서 불연속적으로 합성되는 짧은 DNA 조각이다.","DNA 연결효소가 합성하는 짧은 RNA이다.","복제 원점에서 가장 먼저 만들어지는 프라이머이다."],"a":2,"ex":"오카자키 절편은 지연 가닥이 불연속적으로 합성될 때 생기는 짧은 DNA 조각이다. 이 조각들은 DNA 연결효소가 이어 붙인다."},{"tag":"DNA 복제 과정","q":"진핵세포의 DNA 복제가 여러 곳의 복제 원점에서 동시에 시작되는 까닭으로 가장 알맞은 것은?","c":["DNA가 매우 길어 한 곳에서만 시작하면 복제에 너무 오랜 시간이 걸리기 때문이다.","복제가 여러 번 일어나야 하기 때문이다.","원점이 많으면 돌연변이가 생기지 않기 때문이다.","각 원점마다 서로 다른 유전 정보를 복제하기 때문이다."],"a":1,"ex":"진핵세포의 DNA는 매우 길어서 한 곳에서만 복제를 시작하면 시간이 오래 걸린다. 여러 복제 원점에서 동시에 복제가 진행되어 짧은 시간에 복제를 마칠 수 있다."},{"tag":"복제 원점","q":"대장균과 같은 원핵생물의 환상 DNA에서 복제가 시작되는 복제 원점의 수는 일반적으로 몇 개인가?","c":["1개","수십 개","수천 개","없다"],"a":1,"ex":"원핵생물의 환상 DNA는 보통 복제 원점이 한 곳이며, 이곳에서 양쪽 방향으로 복제가 진행된다. 진핵생물은 DNA가 길어 복제 원점이 여러 곳이다."},{"tag":"복제 원점","q":"복제 원점에서 시작된 DNA 복제는 일반적으로 어떻게 진행되는가?","c":["두 가닥 중 한 가닥만 복제된다.","한쪽 방향으로만 진행된다.","원점과 상관없이 무작위로 시작된다.","양쪽 방향으로 진행되어 복제 거품이 점점 커진다."],"a":4,"ex":"복제 원점에서 복제가 시작되면 양쪽 방향으로 복제 분기점이 이동하면서 복제 거품이 커진다. 두 가닥 모두 주형으로 사용되어 복제된다."},{"tag":"복제 원점","q":"하나의 복제 원점에서 양방향으로 DNA 복제가 진행될 때, 복제 분기점의 수와 합성되는 선도 가닥의 수를 옳게 짝지은 것은?","c":["복제 분기점 1개, 선도 가닥 1개","복제 분기점 2개, 선도 가닥 2개","복제 분기점 1개, 선도 가닥 2개","복제 분기점 2개, 선도 가닥 1개"],"a":2,"ex":"양방향 복제에서는 복제 원점의 양쪽으로 복제 분기점이 하나씩 생겨 모두 2개가 된다. 분기점마다 선도 가닥이 하나씩 합성되므로 선도 가닥도 2개이다."},{"tag":"복제의 정확성","q":"DNA 복제가 끝난 뒤 만들어진 두 DNA 분자의 염기 서열에 대한 설명으로 옳은 것은?","c":["새로 합성된 가닥의 염기 서열은 주형 가닥과 같다.","한 분자만 원래 DNA와 염기 서열이 같다.","두 분자는 원래 DNA와 상보적인 서열을 가진다.","두 분자의 염기 서열은 모두 원래 DNA와 같다."],"a":4,"ex":"복제는 주형 가닥에 상보적인 염기를 연결하는 과정이므로, 만들어진 두 DNA 분자는 모두 원래 DNA와 염기 서열이 같다. 새 가닥의 서열은 주형 가닥과 상보적이다."},{"tag":"DNA 복제 과정","q":"DNA 복제가 매우 정확하게 일어나는 까닭으로 가장 알맞은 것은?","c":["복제가 일어나지 않는 세포이기 때문이다.","염기가 아무렇게나 연결되어도 문제가 되지 않기 때문이다.","상보적 염기만 연결되고, 잘못 연결된 뉴클레오타이드는 DNA 중합효소에 의해 교정되기 때문이다.","복제할 때 항상 RNA를 주형으로 사용하기 때문이다."],"a":3,"ex":"복제는 상보적 염기쌍 결합의 원리로 일어나며, DNA 중합효소가 잘못 끼워진 뉴클레오타이드를 제거하고 바르게 다시 연결하는 교정 기능도 있다. 그래서 오류가 매우 적다."},{"type":"short","tag":"선도 가닥","q":"복제 분기점이 이동하는 방향과 같은 방향으로 연속적으로 합성되는 새 가닥을 무엇이라 하는지 쓰시오.","ans":["선도 가닥","선도가닥","선도","리딩 가닥","leading strand"],"model":"선도 가닥","ci":true,"hint":"용어를 쓴다.","ex":"복제 분기점이 이동하는 방향과 합성 방향이 같은 새 가닥은 끊기지 않고 연속적으로 합성되며, 이를 선도 가닥이라 한다."},{"type":"short","tag":"상보 가닥 쓰기","q":"주형 가닥의 염기 서열이 5′-TTAGCC-3′일 때, 새로 합성되는 가닥의 염기 서열을 5′→3′ 방향으로 쓰시오.","ans":["GGCTAA","5'-GGCTAA-3'"],"model":"5′-GGCTAA-3′","ci":true,"hint":"염기만 써도 되고 5′, 3′ 표시를 함께 써도 된다.","ex":"상보적인 염기를 쓰면 3′-AATCGG-5′이다. 5′→3′ 방향으로 고쳐 쓰면 5′-GGCTAA-3′이다."},{"type":"short","tag":"주형 가닥 찾기","q":"프라이머 5′-GCTA-3′가 결합한 주형 가닥 부분의 염기 서열을 3′→5′ 방향으로 쓰시오.","ans":["CGAT","3'-CGAT-5'"],"model":"3′-CGAT-5′","ci":true,"hint":"염기만 써도 되고 5′, 3′ 표시를 함께 써도 된다.","ex":"프라이머의 각 염기와 상보적인 염기를 왼쪽부터 쓰면 CGAT이다. 주형 가닥은 프라이머와 반대 방향이므로 3′-CGAT-5′이다."},{"type":"essay","tag":"지연 가닥","q":"지연 가닥에서 오카자키 절편이 만들어지는 까닭을 DNA 중합효소의 합성 방향과 복제 분기점의 이동 방향을 사용하여 서술하시오.","model":"DNA 중합효소는 새 가닥을 5′→3′ 방향으로만 합성한다. 지연 가닥의 주형에서는 이 방향이 복제 분기점이 이동하는 방향과 반대이므로, 분기점이 진행하여 주형이 풀릴 때마다 짧은 조각을 불연속적으로 합성한다. 이 조각이 오카자키 절편이다.","rubric":["DNA 중합효소가 5′→3′ 방향으로만 합성한다고 서술했다","지연 가닥의 합성 방향이 복제 분기점의 이동 방향과 반대라고 서술했다","그 결과 짧은 조각이 불연속적으로 합성된다고 서술했다"],"hint":"합성 방향과 분기점 이동 방향을 비교하여 쓴다.","ex":"만들어진 오카자키 절편은 DNA 연결효소가 이어 붙여 하나의 가닥이 된다."},{"type":"essay","tag":"프라이머","q":"DNA 복제 때 프라이머가 필요한 까닭을 DNA 중합효소의 특징과 관련지어 서술하시오.","model":"DNA 중합효소는 이미 있는 가닥의 3′ 말단에만 새 뉴클레오타이드를 연결할 수 있고 새 가닥을 처음부터 시작하지 못한다. 그래서 주형 가닥에 상보적으로 결합한 짧은 프라이머가 3′ 말단을 제공해야 합성이 시작된다.","rubric":["DNA 중합효소는 기존 가닥의 3′ 말단에만 뉴클레오타이드를 연결한다고 서술했다","DNA 중합효소가 새 가닥 합성을 스스로 시작하지 못한다고 서술했다","프라이머가 주형 가닥에 결합하여 3′ 말단을 제공한다고 서술했다"],"hint":"DNA 중합효소가 할 수 없는 일과 프라이머가 하는 일을 함께 쓴다.","ex":"프라이머가 시작점을 만들어 주기 때문에 선도 가닥에서는 한 번, 지연 가닥에서는 절편마다 한 번씩 필요하다."},{"type":"essay","tag":"선도 가닥과 지연 가닥","q":"선도 가닥과 지연 가닥의 차이를 합성 방식(연속·불연속)과 필요한 프라이머의 수를 들어 서술하시오.","model":"선도 가닥은 복제 분기점이 이동하는 방향으로 연속적으로 합성되므로 프라이머가 처음에 하나만 있으면 된다. 지연 가닥은 분기점과 반대 방향으로 짧은 오카자키 절편이 불연속적으로 합성되므로 절편마다 프라이머가 필요하다.","rubric":["선도 가닥은 연속적으로, 지연 가닥은 불연속적으로 합성된다고 서술했다","선도 가닥은 프라이머가 하나면 충분하다고 서술했다","지연 가닥은 절편마다 프라이머가 필요하다고 서술했다"],"hint":"두 가닥의 합성 방식과 프라이머의 수를 함께 쓴다.","ex":"합성 방식이 다르기 때문에 필요한 프라이머의 수도 달라진다."}]},"5":{"short":"유전 가계도 연습문제","topics":["가계도 기호와 우성·열성, 상염색체·성염색체 유전 판별","ABO식 혈액형과 확률 계산","반성유전(적록색맹, 혈우병) 가계도"],"questions":[{"tag":"가계도 기호","q":"가계도 기호에 대한 설명으로 옳은 것은?","c":["남자는 원, 여자는 사각형으로 나타낸다.","남자는 사각형, 여자는 원으로 나타내고 형질이 나타난 사람은 색을 칠한다.","형질이 나타나지 않은 사람에게만 색을 칠한다.","부부는 세로선으로, 자녀는 가로선으로 연결한다."],"a":2,"ex":"가계도에서는 남자를 사각형(□), 여자를 원(○)으로 나타내고, 형질이 나타난 사람은 색을 칠해 구별한다. 부부는 가로선으로 잇고 자녀는 그 아래로 내려 연결한다."},{"tag":"쌍둥이 연구","q":"일란성 쌍둥이에 대한 설명으로 옳은 것은?","c":["혈액형이 서로 다르게 태어난다.","성별이 서로 다르게 태어난다.","하나의 수정란이 초기에 둘로 나뉘어 발생하며 유전자가 같다.","서로 다른 두 수정란에서 발생하며 유전자가 서로 다르다."],"a":3,"ex":"일란성 쌍둥이는 하나의 수정란이 초기에 둘로 나뉘어 각각 개체로 자란 것이어서 유전자가 같고, 성별과 혈액형도 같다."},{"tag":"쌍둥이 연구","q":"일란성 쌍둥이를 서로 다른 환경에서 키웠더니 어떤 형질에서 차이가 나타났다. 이 결과에서 알 수 있는 것은?","c":["그 형질에는 환경의 영향이 있다.","일란성 쌍둥이는 유전자가 서로 다르다.","그 형질은 유전자만으로 결정된다.","그 형질은 열성이다."],"a":1,"ex":"유전자가 같은 일란성 쌍둥이 사이의 차이는 환경의 영향으로 나타난 것이다. 표현형은 유전자형과 환경의 영향을 모두 받는다."},{"tag":"가계도 해석","q":"다음 가계도 정보에 대한 설명으로 옳은 것은?","box":"1세대: 정상인 아버지, 정상인 어머니\n2세대: 정상인 아들, 유전병이 있는 딸\n(이 유전병은 한 쌍의 대립유전자에 의해 결정된다.)","c":["병 유전자는 열성이며 부모는 모두 보인자이다.","병 유전자는 우성이며 부모는 모두 이형접합이다.","병 유전자는 X염색체에 있는 열성 유전자이다.","병은 환경에 의해서만 나타난다."],"a":1,"ex":"정상인 부모에게서 병이 있는 자녀가 태어났으므로 병 유전자는 열성이고 부모는 모두 열성 유전자를 하나씩 가진 보인자이다. 병이 있는 딸의 아버지가 정상이므로 X염색체 열성이 아니라 상염색체 열성 유전이다."},{"tag":"가계도 해석","q":"정상인 부모 사이에서 열성 유전병을 가진 자녀가 태어났다. 이 부모의 유전자형을 정상 대립유전자를 A, 병 대립유전자를 a라고 할 때 옳게 나타낸 것은?","c":["Aa × Aa","Aa × aa","AA × Aa","AA × AA"],"a":1,"ex":"자녀(aa)는 부모 양쪽에서 a를 받아야 한다. 부모는 정상이므로 모두 Aa(보인자)이다."},{"tag":"가계도 해석","q":"어떤 우성 유전병이 부모 중 한 명에게만 있었는데, 자녀 중 정상인 아이가 태어났다. 병이 있는 부모의 유전자형을 병 유전자 D(우성), 정상 유전자 d라고 할 때 옳은 것은?","c":["dd","DD","DD 또는 Dd","Dd"],"a":4,"ex":"정상 자녀(dd)는 병이 있는 부모에게서도 d를 받았으므로 병이 있는 부모는 Dd이다."},{"tag":"가계도 해석","q":"상염색체에 있는 한 쌍의 대립유전자로 결정되는 형질이 부모에게는 나타나지 않았는데 자녀에게서 나타났다. 이에 대한 설명으로 옳은 것은?","c":["자녀에게 나타난 형질은 열성이며 부모는 모두 그 유전자를 하나씩 가진 보인자이다.","부모 중 한 명만 이 형질의 유전자를 가진다.","자녀에게 나타난 형질은 우성이며 부모는 모두 동형접합이다.","자녀의 유전자형은 이형접합이다."],"a":1,"ex":"부모에게 없던 형질이 자녀에게 나타나면 그 형질은 열성이다. 자녀는 열성 대립유전자를 부모 양쪽에서 받았으므로 부모는 모두 열성 유전자를 하나씩 가진 보인자이다."},{"tag":"가계도 해석","q":"다음 가계도 정보에 대한 설명으로 옳은 것은? (이 유전병은 한 쌍의 대립유전자에 의해 결정되며 돌연변이는 고려하지 않는다.)","box":"1세대: 병이 있는 아버지, 병이 있는 어머니\n2세대: 병이 있는 아들, 정상인 딸","c":["병 유전자는 열성이며 부모는 모두 보인자이다.","병 유전자는 열성이며 부모는 모두 병 유전자의 동형접합이다.","병 유전자는 상염색체에 있는 우성 유전자이며 부모는 모두 이형접합이다.","병 유전자는 Y염색체에 있다."],"a":3,"ex":"병이 있는 부모에게서 정상인 딸이 태어났으므로 병은 우성 형질이고 부모는 모두 이형접합(Dd)이다. 병이 있는 아버지의 딸이 정상이므로 X염색체 우성도 아니며, 병이 있는 어머니가 있으므로 Y염색체 유전도 아니다."},{"tag":"확률 계산","q":"다음 가계도 정보에서 상염색체 열성 유전병에 대해 정상인 아들이 보인자일 확률은?","box":"1세대: 정상인 아버지, 정상인 어머니\n2세대: 병이 있는 딸, 정상인 아들","c":["1/4","1/3","1/2","2/3"],"a":4,"ex":"부모는 모두 보인자(Aa)이므로 자녀의 유전자형 비는 AA : Aa : aa = 1 : 2 : 1이다. 정상인 아들은 AA 또는 Aa이고 그 비는 1 : 2이므로 보인자일 확률은 2/3이다."},{"tag":"가계도 해석","q":"보인자에 대한 설명으로 옳은 것은?","c":["열성 유전병이 겉으로 나타난 사람이다.","정상 유전자만 가진 사람이다.","우성 유전병을 가진 사람이다.","열성 유전병 유전자를 가지고 있지만 병은 나타나지 않는 사람이다."],"a":4,"ex":"보인자는 열성 유전병 유전자를 하나 가지고 있지만 우성 정상 유전자에 가려 병이 나타나지 않는 사람이다. 보인자는 자녀에게 그 유전자를 물려줄 수 있다."},{"tag":"ABO식 혈액형","q":"ABO식 혈액형을 결정하는 대립유전자는 몇 종류이며, 한 사람은 그중 몇 개를 가지는가?","c":["2종류, 2개","3종류, 2개","3종류, 3개","4종류, 2개"],"a":2,"ex":"ABO식 혈액형은 IA, IB, i의 3종류 대립유전자에 의해 결정되며, 사람은 상동염색체에 각각 하나씩 총 2개를 가진다. 이처럼 대립유전자가 셋 이상인 유전을 복대립 유전이라고 한다."},{"tag":"ABO식 혈액형","q":"ABO식 혈액형에서 A형의 유전자형으로 가능한 것을 모두 고른 것은? (IA, IB는 i에 대해 우성이며 IA와 IB 사이에는 우열이 없다.)","c":["IAIA, IAIB","IAIA, IAi","IAIA, IAi, ii","IAi만"],"a":2,"ex":"A형의 유전자형은 IAIA 또는 IAi이다. IAIB는 AB형, ii는 O형이다."},{"tag":"ABO식 혈액형","q":"AB형의 유전자형과 O형의 유전자형을 옳게 짝지은 것은?","c":["AB형 IAIB, O형 IAIB","AB형 IAi, O형 IBi","AB형 IAIB, O형 ii","AB형 ii, O형 IAIB"],"a":3,"ex":"AB형은 IA와 IB를 모두 가진 IAIB이고, O형은 우성 대립유전자가 없는 ii이다."},{"tag":"ABO식 혈액형","q":"A형(IAi)인 아버지와 B형(IBi)인 어머니 사이에서 태어날 수 있는 자녀의 혈액형을 모두 나타낸 것은?","c":["A형, B형, AB형","AB형, O형","A형, B형, AB형, O형","A형, B형"],"a":3,"ex":"IAi와 IBi에서 만들어지는 생식세포의 조합은 IAIB(AB형), IAi(A형), IBi(B형), ii(O형)로 네 가지 혈액형이 모두 가능하다."},{"tag":"ABO식 혈액형","q":"AB형(IAIB)인 사람과 O형(ii)인 사람 사이에서 태어날 수 있는 자녀의 혈액형은?","c":["O형만","AB형, O형","A형, B형, AB형","A형, B형"],"a":4,"ex":"자녀는 AB형 부모에게서 IA 또는 IB를, O형 부모에게서 i를 받으므로 IAi(A형) 또는 IBi(B형)이다. AB형과 O형 자녀는 태어나지 않는다."},{"tag":"ABO식 혈액형","q":"A형인 부모 사이에서 O형 자녀가 태어났다. 부모의 유전자형은?","c":["IAIA × IAIA","IAi × IAi","IAi × ii","IAIA × IAi"],"a":2,"ex":"O형 자녀(ii)는 부모 양쪽에서 i를 받아야 한다. 부모가 모두 A형이므로 두 사람 모두 IAi이다."},{"tag":"ABO식 혈액형","q":"IAi인 A형 아버지와 IBi인 B형 어머니 사이에서 O형 자녀가 태어날 확률은?","c":["0","1/2","1/4","3/4"],"a":3,"ex":"아버지에게서 i를 받을 확률 1/2과 어머니에게서 i를 받을 확률 1/2을 곱하면 1/4이다."},{"tag":"두 형질 확률","q":"유전자형이 IAi, Aa인 아버지와 IBi, Aa인 어머니 사이에서 AB형이면서 유전병(aa)인 아이가 태어날 확률은? (혈액형 유전자와 유전병 유전자는 서로 다른 상염색체에 있으며, a는 열성 병 유전자이다.)","c":["1/16","1/8","1/4","3/16"],"a":1,"ex":"AB형이 태어날 확률은 1/4(IA를 받을 확률 1/2 × IB를 받을 확률 1/2)이고, aa일 확률은 1/4이다. 두 형질은 독립적으로 유전되므로 1/4 × 1/4 = 1/16이다."},{"tag":"반성유전","q":"반성유전에 대한 설명으로 옳은 것은?","c":["유전자가 미토콘드리아에만 있다.","유전자가 성염색체에 있어 형질이 나타나는 빈도가 성별에 따라 다르다.","유전자가 상염색체에 있어 남녀에게 똑같이 나타난다.","환경에 의해서만 나타난다."],"a":2,"ex":"반성유전은 유전자가 성염색체(주로 X염색체)에 있어 남녀에 따라 형질이 나타나는 빈도가 다른 유전이다. 적록색맹과 혈우병이 대표적이다."},{"tag":"반성유전","q":"적록색맹 유전자는 어디에 있으며 정상 유전자에 대해 어떤 관계인가?","c":["X염색체에 있으며 열성이다.","X염색체에 있으며 우성이다.","Y염색체에 있으며 열성이다.","상염색체에 있으며 우성이다."],"a":1,"ex":"적록색맹 유전자는 X염색체에 있으며 정상 유전자에 대해 열성이다."},{"tag":"반성유전","q":"정상인 남자(XRY)와 보인자 여자(XRXr) 사이에서 적록색맹인 아들이 태어날 확률은? (자녀 전체를 기준으로 한다.)","c":["1/2","1/4","1/8","0"],"a":2,"ex":"자녀의 유전자형은 XRXR, XRXr, XRY, XrY가 1 : 1 : 1 : 1이다. 색맹인 아들(XrY)은 전체의 1/4이다."},{"tag":"반성유전","q":"적록색맹인 남자(XrY)와 정상인 여자(XRXR) 사이에서 태어나는 자녀에 대한 설명으로 옳은 것은?","c":["딸은 모두 색맹이다.","아들은 모두 색맹이다.","딸과 아들 모두 색맹이다.","딸은 모두 보인자이고 아들은 모두 정상이다."],"a":4,"ex":"아들은 아버지에게서 Y를, 어머니에게서 XR를 받아 모두 정상(XRY)이고, 딸은 아버지의 Xr와 어머니의 XR를 받아 모두 보인자(XRXr)이다."},{"tag":"반성유전 가계도","q":"다음 가계도 정보에서, 어머니와 정상인 아버지 사이에서 태어난 아들이 적록색맹일 확률은?","box":"외할아버지: 적록색맹, 외할머니: 정상(색맹 유전자 없음)\n어머니: 정상, 아버지: 정상","c":["0","1/4","1/2","1"],"a":3,"ex":"어머니는 외할아버지에게서 색맹 유전자(Xr)를, 외할머니에게서 XR를 받았으므로 보인자(XRXr)이다. 정상인 아버지(XRY)와의 사이에서 아들은 어머니에게서 XR 또는 Xr를 받으므로 색맹일 확률은 1/2이다."},{"tag":"반성유전","q":"혈우병 유전자는 X염색체에 있는 열성 유전자이다. 혈우병인 아버지(XhY)와 정상인 어머니(XHXH) 사이에서 태어난 아들이 혈우병일 확률은?","c":["0","1/4","1/2","1"],"a":1,"ex":"아들은 아버지에게서 Y염색체를, 어머니에게서 XH를 받으므로 모두 정상(XHY)이다. 혈우병 유전자는 아버지에게서 아들로 전달되지 않는다."},{"tag":"반성유전 가계도","q":"다음 가계도 정보에서 이 유전병이 X염색체에 있는 열성 유전자(h)에 의한 것이라고 할 때, 정상인 딸의 유전자형은? (정상 유전자는 H이다.)","box":"1세대: 정상인 아버지, 병이 있는 어머니\n2세대: 병이 있는 아들, 정상인 딸","c":["XhXh","XHXh","XHXH","XhY"],"a":2,"ex":"병이 있는 어머니는 XhXh이고 정상인 아버지는 XHY이다. 딸은 아버지에게서 XH를, 어머니에게서 Xh를 받으므로 XHXh(보인자)이다."},{"tag":"반성유전 가계도","q":"다음 가계도 정보로 알 수 있는 이 유전병의 유전 방식으로 옳은 것은?","box":"1세대: 병이 있는 아버지, 정상인 어머니\n2세대: 딸은 모두 병이 있고, 아들은 모두 정상이다.","c":["상염색체 열성 유전이다.","X염색체 열성 유전이다.","Y염색체 유전이다.","X염색체 우성 유전이다."],"a":4,"ex":"병이 있는 아버지의 X염색체는 모든 딸에게 전달되고 아들에게는 Y염색체가 전달된다. 딸이 모두 병이 있고 아들이 모두 정상이므로 X염색체 우성 유전이다."},{"tag":"반성유전","q":"아버지에게서 아들로만 전달되는 형질의 유전자가 있는 곳은?","c":["상염색체","미토콘드리아","X염색체","Y염색체"],"a":4,"ex":"Y염색체는 아버지에게서 아들로만 전달된다. 따라서 Y염색체에 있는 유전자에 의한 형질은 아버지에게서 아들로만 유전된다."},{"type":"short","tag":"반성유전","q":"정상 유전자를 XR, 적록색맹 유전자를 Xr라고 할 때, 정상인 보인자 여자의 유전자형을 쓰시오.","ans":["XRXr","XrXR"],"model":"XRXr","ci":false,"hint":"위첨자 없이 쓴다. 정상인 남자는 XRY처럼 쓰고, 대문자와 소문자를 구분한다.","ex":"보인자 여자는 정상 유전자와 적록색맹 유전자를 하나씩 가지므로 XRXr이다."},{"type":"short","tag":"반성유전","q":"적록색맹인 아들의 적록색맹 유전자는 부모 중 누구에게서 물려받은 것인지 쓰시오.","ans":["어머니","엄마","모"],"model":"어머니","ci":true,"hint":"아버지와 어머니 중에서 쓴다.","ex":"아들은 아버지에게서 Y 염색체를, 어머니에게서 X 염색체를 물려받는다. 아들의 X 염색체에 있는 적록색맹 유전자는 어머니에게서 온 것이다."},{"type":"essay","tag":"반성유전","q":"적록색맹이 여자보다 남자에게서 더 많이 나타나는 까닭을 성염색체 구성과 관련지어 서술하시오.","model":"적록색맹 유전자는 X 염색체에 있는 열성 유전자이다. 여자(XX)는 이 유전자가 두 개 모두 있어야 적록색맹이 되지만, 남자(XY)는 X 염색체가 하나뿐이어서 이 유전자가 하나만 있어도 적록색맹이 된다.","rubric":["적록색맹 유전자가 X 염색체에 있는 열성 유전자라고 서술했다","여자는 열성 유전자가 두 개 모두 있어야 나타난다고 서술했다","남자는 X 염색체가 하나뿐이라 열성 유전자 하나만 있어도 나타난다고 서술했다"],"hint":"남녀의 성염색체 구성을 비교하여 쓴다.","ex":"남자는 X 염색체를 하나만 가지므로 열성 유전자가 있으면 바로 형질이 나타난다."}]}};

    return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- 내 답안(이 기기에만 저장) ---------- */
  function loadMine() {

    } catch (e) {}
  }
  function saveMine() {
    lsSet("yj2-ans-" + state.set, JSON.stringify({ t: state.startedAt, a: mine, s: chk }));
    scheduleSave(false);
  }

  /* ---------- 학번·이름, 답안 제출(공유 저장소) ---------- */
  function loadWho() {

    if (!raw) return;

    } catch (e) {}
  }
  function needWho() { return !teacher && !previewing && !forceTeacherView(); }
  function forceTeacherView() { return false; }
  function canSubmit() { return !!(dbh && uid && who && !teacher && !previewing && state.phase !== "ready" && state.startedAt); }
  function setSubMsg(msg, bad) {
    subMsg = msg; subBad = !!bad;
    var nodes = document.querySelectorAll(".subst");

  function subText() {

    return subMsg || "답안은 자동으로 선생님께 전달된다.";
  }
  function scheduleSave(now) {

  }
  async function doSave() {

    }
  }
  function renderIdentity(main) {
    var c = el("section", "ready");

    c.appendChild(el("p", "hint", "선생님이 점수를 확인하는 데 쓴다. 한 번 입력하면 이 기기에 저장된다."));
    var f = el("form", "idform");
    var l1 = el("label", "", "학번");
    var i1 = document.createElement("input");
    i1.type = "text"; i1.setAttribute("inputmode", "numeric"); i1.maxLength = 12;
    i1.setAttribute("autocomplete", "off"); i1.setAttribute("aria-label", "학번");

    f.appendChild(l1); f.appendChild(l2); f.appendChild(b); f.appendChild(msg);
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var no = i1.value.trim(), nm = i2.value.trim();
      if (!no || !nm) { msg.textContent = "학번과 이름을 모두 입력한다."; return; }
      who = { no: no, name: nm };

    main.appendChild(c);
  }
  function whoLine() {
    var p = el("p", "who");
    p.appendChild(document.createTextNode("학번 "));
    p.appendChild(el("b", "", who.no));
    p.appendChild(document.createTextNode(" · 이름 "));
    p.appendChild(el("b", "", who.name));
    p.appendChild(document.createTextNode(" "));
    var b = el("button", "linkbtn", "바꾸기");
    b.type = "button";
    b.addEventListener("click", function () { who = null; lsSet("yj2-who", ""); render(); });
    p.appendChild(b);
    return p;
  }

  /* ---------- 채점 ---------- */
  function norm(s, ci) {
    s = String(s == null ? "" : s);
    s = s.replace(/[′’´`‵ʹ]/g, "'");
    s = s.replace(/→|⟶|⇒|-->|–>|—>|->/g, ">");
    s = s.replace(/[\s·.,\-–—_]/g, "");
    s = s.replace(/방향/g, "");
    if (ci) s = s.toLowerCase();
    return s;
  }
  function hasAns(q, v) {
    if (qtype(q) === "mc") return !!v;
    return typeof v === "string" && v.trim().length > 0;
  }
  /* 한 문항의 점수. v=답, sf=서술형 자기채점 배열, adj=교사가 정한 서술형 점수(없으면 null) */
  function qPts(q, v, sf, adj) {
    if (!hasAns(q, v)) return 0;
    var t = qtype(q);
    if (t === "mc") return v === q.a ? 1 : 0;
    if (t === "short") {
      var mv = norm(v, q.ci);
      return (q.ans || []).some(function (a) { return norm(a, q.ci) === mv; }) ? 1 : 0;
    }
    if (typeof adj === "number" && adj >= 0) return adj;
    if (!sf || !q.rubric || !q.rubric.length) return 0;
    var c = 0;
    for (var k = 0; k < q.rubric.length; k++) if (sf[k]) c++;
    return c / q.rubric.length;
  }
  function isAnswered(q, i) { return hasAns(q, mine[i]); }
  function points(q, i) { return qPts(q, mine[i], chk[i], null); }
  function status(q, i) {
    if (!isAnswered(q, i)) return "blank";
    if (qtype(q) === "essay" && !chk[i]) return "pending";
    var p = points(q, i);
    return p >= 1 ? "full" : (p > 0 ? "part" : "wrong");
  }
  function counts() {
    var c = { full: 0, part: 0, wrong: 0, blank: 0, pending: 0 };
    var earned = 0, answered = 0;
    data.questions.forEach(function (q, i) {
      if (isAnswered(q, i)) answered++;
      earned += points(q, i);
      c[status(q, i)]++;
    });
    c.total = data.questions.length;
    c.earned = earned;
    c.answered = answered;
    return c;
  }
  function fmtPts(x) {
    var r = Math.round(x * 10) / 10;
    return r % 1 === 0 ? String(r) : r.toFixed(1);
  }

  /* ---------- 시간 ---------- */
  function remaining() {
    if (state.phase !== "solve") return state.minutes * 60;
    return state.minutes * 60 - (Date.now() - state.startedAt) / 1000;
  }
  function reviewRemaining() {
    return REVIEW_MIN * 60 - (Date.now() - (state.revealedAt || Date.now())) / 1000;
  }
  function isLocked() {
    return state.phase !== "solve" || remaining() <= 0;
  }

  function tick() {
    if (state.phase === "solve" && remaining() <= 0) {
      applyState({ set: state.set, phase: "wait", startedAt: state.startedAt, minutes: state.minutes, revealedAt: 0 });
      return;
    }
    var clock = $("clock");
    var lbl = $("clockLbl"), val = $("clockVal"), fill = $("barFill");
    var cls = "clock", pct = 0;
    if (state.phase === "ready") {
      lbl.textContent = "대기";
      val.textContent = "--:--";
    } else if (state.phase === "solve") {
      var r = remaining();
      if (r <= 0) {
        lbl.textContent = "시간 종료";
        val.textContent = "00:00";
        cls += " end";
        pct = 100;
      } else {
        lbl.textContent = "남은 시간";
        val.textContent = fmt(r);
        pct = (1 - r / (state.minutes * 60)) * 100;
        if (r <= 300) cls += " low";
      }
    } else if (state.phase === "wait") {
      var wr = state.minutes * 60 - (Date.now() - state.startedAt) / 1000;
      lbl.textContent = wr > 0 ? "남은 시간" : "제출 완료";
      val.textContent = wr > 0 ? fmt(wr) : "대기";
      pct = (1 - Math.max(0, wr) / (state.minutes * 60)) * 100;
    } else {
      var rr = reviewRemaining();
      lbl.textContent = "풀이 시간";
      val.textContent = fmt(rr);
      pct = (1 - Math.max(0, rr) / (REVIEW_MIN * 60)) * 100;
      if (rr <= 300) cls += " low";
      if (rr <= 0) cls += " end";
    }
    clock.className = cls;
    $("top").dataset.t = cls.indexOf("end") > -1 ? "end" : (cls.indexOf("low") > -1 ? "low" : "");
    fill.style.width = Math.min(100, Math.max(0, pct)) + "%";
    var lk = isLocked();
    if (lastLocked !== null && lk !== lastLocked) { scheduleSave(true); render(); }
    lastLocked = lk;
  }

  /* ---------- 상태 적용과 쓰기 ---------- */
  function sameState(a, b) {
    return a.set === b.set && a.phase === b.phase && a.startedAt === b.startedAt &&
      a.minutes === b.minutes && a.revealedAt === b.revealedAt;
  }
  function applyState(s) {
    if (previewing) return;
    var next = {
      set: Number(s.set) || 1,
      phase: s.phase === "solve" || s.phase === "review" || s.phase === "wait" ? s.phase : "ready",
      startedAt: Number(s.startedAt) || 0,
      minutes: Number(s.minutes) || 30,
      revealedAt: Number(s.revealedAt) || 0
    };
    if (sameState(state, next) && data) return;
    var setChanged = next.set !== state.set || !data || dataSet !== next.set;
    state = next;
    lsSet("yj3-state", JSON.stringify(state));
    if (state.phase !== "ready") lsSet("yj3-sess-" + state.set, JSON.stringify(state));

  }
  function pushState(patch) {

    } else {
      setStatus(false);
    }
  }
  function setStatus(ok) {
    var s = $("status");

    else s.textContent = "이 화면에만 적용됨";
  }

  /* ---------- 데이터 ---------- */
  function loadSet(n) {
    loadErr = false;

    data = d; dataSet = n;
    loadMine();
    render();
  }

  /* ---------- 화면 ---------- */
  function render() {
    var main = $("main");
    main.textContent = "";
    var title = $("setTitle");
    if (resultsMode && teacher && !previewing) { renderResults(main); return; }
    if (!data) {
      title.textContent = state.set + "회차";
      main.appendChild(el("p", "note" + (loadErr ? " err" : ""),
        loadErr ? "이 회차의 문제를 불러오지 못했다. 잠시 뒤 다시 열어 보자." : "문제를 불러오는 중이다."));
      return;
    }
    title.textContent = state.phase === "ready" ? "보충 수업 문제풀이" : state.set + "회차 · " + data.short;
    var key = state.set + ":" + state.phase + ":" + state.startedAt;

    if (needWho() && !who) { renderIdentity(main); return; }
    if (state.phase === "ready") { renderReady(main); return; }
    if (state.phase === "wait") { renderWait(main); return; }

  }

  function sessOf(k) {
    try {
      var o = JSON.parse(lsGet("yj3-sess-" + k) || "null");
      if (o && o.set === k && (o.phase === "solve" || o.phase === "wait" || o.phase === "review")) return o;
    } catch (e) {}
    return null;
  }
  function renderReady(main) {
    var c = el("section", "ready");
    c.appendChild(el("h2", "", "시작 코드를 입력한다"));
    if (who) c.appendChild(whoLine());
    c.appendChild(el("p", "hint", "선생님이 알려 주는 시작 코드를 입력하면 그 회차가 열린다. 코드가 없는 회차는 열 수 없다."));
    var ul = el("ul");
    TITLES.forEach(function (t, k) {
      var s = sessOf(k + 1);
      var tag = s ? (s.phase === "review" ? " (완료)" : " (진행 중)") : "";
      ul.appendChild(el("li", "", (k + 1) + "회차 · " + t + tag));
    });
    c.appendChild(ul);
    var f = el("form", "idform");
    var l = el("label", "", "시작 코드");
    var inp = document.createElement("input");
    inp.type = "text"; inp.setAttribute("inputmode", "numeric"); inp.maxLength = 8;
    inp.setAttribute("autocomplete", "off"); inp.setAttribute("aria-label", "시작 코드");
    l.appendChild(inp);
    var b = el("button", "btn primary", "문제 시작");
    b.type = "submit";
    var msg = el("p", "note err");
    f.appendChild(l); f.appendChild(b); f.appendChild(msg);
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = inp.value.trim(), hit = 0;
      if (v === RESET) {
        for (var r = 1; r <= 5; r++) { lsSet("yj3-sess-" + r, ""); lsSet("yj2-ans-" + r, ""); }
        lsSet("yj3-state", "");
        render();
        return;
      }
      for (var k = 1; k <= 5; k++) if (START[k] === v) hit = k;
      if (!hit) { msg.textContent = "코드가 맞지 않는다. 선생님이 알려 준 코드를 다시 확인한다."; return; }
      var s = sessOf(hit);
      if (s) applyState(s);

    });
    c.appendChild(f);
    main.appendChild(c);
  }

  function renderWait(main) {
    var c = el("section", "ready");
    c.appendChild(el("h2", "", "제출했다"));
    c.appendChild(el("p", "", "다른 친구들이 끝날 때까지 기다린다. 선생님이 해설을 시작하며 알려 주는 공개 코드를 입력하면 정답과 해설이 열린다."));
    var f = el("form", "idform");
    var l = el("label", "", "공개 코드");
    var inp = document.createElement("input");
    inp.type = "text"; inp.setAttribute("inputmode", "numeric"); inp.maxLength = 8;
    inp.setAttribute("autocomplete", "off"); inp.setAttribute("aria-label", "공개 코드");

    var msg = el("p", "note err");

      e.preventDefault();
      if (inp.value.trim() !== CODES[state.set]) { msg.textContent = "코드가 맞지 않는다. 선생님이 알려 준 코드를 다시 확인한다."; return; }
      applyState({ set: state.set, phase: "review", startedAt: state.startedAt, minutes: state.minutes, revealedAt: Date.now() });
    });

    main.appendChild(c);
  }

  function screens() {
    var arr = [], n = data.questions.length, i;
    if (state.phase === "review") arr.push({ t: "score" });
    for (i = 0; i < n; i++) arr.push({ t: "q", i: i });
    if (state.phase === "solve") arr.push({ t: "check" });
    if (state.phase === "review") arr.push({ t: "score", end: true });
    return arr;
  }
  function offset() { return state.phase === "review" ? 1 : 0; }

  function renderPaper(main) {
    var sc = screens();

    var s = sc[cur];
    var review = state.phase === "review";
    var locked = isLocked();
    if (s.t === "score") main.appendChild(scorePane(!!s.end));
    else if (s.t === "check") main.appendChild(checkPane());
    else main.appendChild(card(data.questions[s.i], s.i, review, locked));
    main.appendChild(navbar(sc, s));
  }

  function goTo(n) {
    var sc = screens();
    if (n < 0 || n > sc.length - 1) return;
    cur = n;
    render();
    window.scrollTo(0, 0);
  }

  function navbar(sc, s) {
    var nb = el("div", "navbar");
    var prev = el("button", "btn", "이전");
    prev.type = "button";
    prev.disabled = cur <= 0;
    prev.addEventListener("click", function () { goTo(cur - 1); });
    var mid = el("button", "btn mid", s.t === "q" ? (s.i + 1) + " / " + data.questions.length : (s.t === "score" ? "총점" : "제출"));
    mid.type = "button";
    mid.setAttribute("aria-label", "문항 번호표 열기");
    mid.addEventListener("click", openSheet);
    var label = "다음";
    var lastScreen = cur >= sc.length - 1;
    if (state.phase === "solve" && s.t === "q" && s.i === data.questions.length - 1) label = "제출";
    if (state.phase === "review" && s.t === "q" && s.i === data.questions.length - 1) label = "총점 보기";
    if (lastScreen) label = state.phase === "review" ? "마지막 문제" : "마지막";
    var next = el("button", "btn primary", label);
    next.type = "button";
    next.disabled = lastScreen;
    next.addEventListener("click", function () { goTo(cur + 1); });
    nb.appendChild(prev); nb.appendChild(mid); nb.appendChild(next);
    return nb;
  }

  function navClass(i) {
    var q = data.questions[i];
    if (state.phase === "review") {
      var st = status(q, i);
      return { full: "ok", part: "part", wrong: "bad", blank: "none", pending: "pend" }[st];
    }

  }
  function buildGrid(container, onPick) {
    var grid = el("div", "omr");
    var sc = screens();
    var curQ = sc[cur] && sc[cur].t === "q" ? sc[cur].i : -1;
    data.questions.forEach(function (q, i) {
      var b = el("button", "", String(i + 1));
      b.type = "button";
      b.setAttribute("aria-label", (i + 1) + "번 문항");

    });
    container.appendChild(grid);
    container.appendChild(el("p", "legend", state.phase === "review"
      ? "푸른 칸은 정답, 붉은 칸은 오답, 붉은 점선은 미응답, 노란 테두리는 부분 점수, 푸른 점선은 채점 전 서술형이다."
      : "푸른 칸은 답을 입력한 문항이다. 흰 칸은 아직 답하지 않았다."));

  function openSheet() {

    $("sheet").hidden = false;
    $("sheetClose").focus();
  }
  function closeSheet() { $("sheet").hidden = true; }
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetBg").addEventListener("click", closeSheet);

  function checkPane() {
    var c = el("section", "pane");
    var cnt = counts();
    c.appendChild(el("h2", "", "제출 전 확인"));
    c.appendChild(el("p", "", "답을 입력한 문항은 " + cnt.answered + " / " + cnt.total + "개이다."));
    var todo = [];
    data.questions.forEach(function (q, i) { if (!isAnswered(q, i)) todo.push(i); });
    if (todo.length) {

      var box = el("div", "todo");
      todo.forEach(function (i) {

      });
      c.appendChild(box);

  function resRows() {
    var rows = [];
    var cutSt = state.phase !== "ready" && state.startedAt ? state.startedAt : 0;
    Object.keys(subs).forEach(function (id) {
      var sb = subs[id];
      var r = sb && sb.r && sb.r[String(state.set)];
      if (!r) return;
      if (cutSt && r.st !== cutSt) return;
      var ans = r.a || {}, cs = r.c || {};
      var adjm = (sb.adj && sb.adj[String(state.set)]) || {};
      var earned = 0, pend = 0, wrong = [], per = [];
      data.questions.forEach(function (q, i) {
        var ad = adjm[i];
        var p = qPts(q, ans[i], cs[i], ad);
        var fixed = typeof ad === "number" && ad >= 0;
        earned += p;
        per.push(p);
        if (qtype(q) === "essay" && hasAns(q, ans[i]) && !fixed && !cs[i]) pend++;
        if (p < 1) wrong.push(i + 1);
      });
      rows.push({ id: id, no: String(sb.no || ""), name: String(sb.name || ""), earned: earned, pend: pend, wrong: wrong, per: per, ans: ans, cs: cs, adj: adjm, t: r.t });
    });
    rows.sort(function (a, b) { return a.no.localeCompare(b.no, "ko", { numeric: true }); });
    return rows;
  }

    setStatus();
    if (data) render();
  }
  $("selSet").addEventListener("change", function () {
    pushState({ set: Number($("selSet").value), phase: "ready", startedAt: 0, revealedAt: 0 });
  });
  $("selMin").addEventListener("change", function () {
    if (state.phase === "ready") pushState({ minutes: Number($("selMin").value) });
  });
  $("btnStart").addEventListener("click", function () {
    pushState({ phase: "solve", startedAt: Date.now(), minutes: Number($("selMin").value), revealedAt: 0 });
  });
  $("btnReveal").addEventListener("click", function () {
    if (state.phase === "ready") return;
    pushState({ phase: "review", revealedAt: Date.now() });
  });
  $("btnReset").addEventListener("click", function () {
    pushState({ phase: "ready", startedAt: 0, revealedAt: 0 });
  });

  /* ---------- 학생 화면 미리보기 (이 화면에서만 적용) ---------- */
  function copyState(o) { var c = {}; for (var k in o) c[k] = o[k]; return c; }
  function setPbarH() {
    document.documentElement.style.setProperty("--pbar-h", previewing ? $("pbar").offsetHeight + "px" : "0px");
  }
  function startPreview() {
    if (previewing) return;
    if (resultsMode) toggleResults(false);
    saved = copyState(state);
    previewing = true;
    state = copyState(state);
    if (state.phase === "ready") { state.phase = "solve"; state.startedAt = Date.now(); state.revealedAt = 0; }
    $("tbar").hidden = true;
    $("pbar").hidden = false;
    setPbarH();
    $("pSet").value = String(state.set);
    loadMine();
    render();
    tick();
    window.scrollTo(0, 0);
  }
  function setLocal(patch) {
    for (var k in patch) state[k] = patch[k];
    loadMine();
    render();
    tick();
    window.scrollTo(0, 0);
  }
  function exitPreview() {
    if (!previewing) return;
    previewing = false;
    state = copyState(saved);
    saved = null;
    $("pbar").hidden = true;
    setPbarH();
    closeSheet();
    if (teacher) $("tbar").hidden = false;
    $("selSet").value = String(state.set);
    $("selMin").value = String(state.minutes);
    loadMine();
    if (!data || dataSet !== state.set) { loadSet(state.set); } else { render(); }
    tick();
  }
  $("btnPreview").addEventListener("click", startPreview);
  $("btnResults").addEventListener("click", function () { toggleResults(!resultsMode); });
  $("pExit").addEventListener("click", exitPreview);
  $("pSet").addEventListener("change", function () {
    state.set = Number($("pSet").value);
    if (state.phase === "solve") state.startedAt = Date.now();
    loadMine();
    loadSet(state.set);
    tick();
  });
  Array.prototype.forEach.call(document.querySelectorAll("#pbar [data-p]"), function (b) {
    b.addEventListener("click", function () {
      var p = b.getAttribute("data-p");
      if (p === "ready") setLocal({ phase: "ready", startedAt: 0, revealedAt: 0 });
      else if (p === "solve") setLocal({ phase: "solve", startedAt: Date.now(), revealedAt: 0 });
      else setLocal({ phase: "review", startedAt: state.startedAt || Date.now(), revealedAt: Date.now() });
    });
  });
  window.addEventListener("resize", function () { if (previewing) setPbarH(); });

  document.addEventListener("keydown", function (e) {
    if (!data || state.phase === "ready" || !$("sheet").hidden) return;
    var tg = e.target && e.target.tagName;
    if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
    if (e.key === "ArrowRight") goTo(cur + 1);
    if (e.key === "ArrowLeft") goTo(cur - 1);
  });

  /* ---------- 시작 ---------- */
  loadWho();
  applyState(state);
  setInterval(tick, 500);
  tick();

})();
</script>
</body></html>
